<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>销毁清册</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/layui/css/layui.css}" rel="stylesheet">
    <link th:href="@{/admin/admin-ui/css/admin.css}" rel="stylesheet">
    <link th:href="@{/css/kdesign.css}" rel="stylesheet">
    <style>
        body { background: #F2F2F2; padding: 12px; }
        .toolbar-form { background: #fff; padding: 12px 12px 0; border-radius: 4px 4px 0 0; }
        .table-box { background: #fff; padding: 8px; border-radius: 0 0 4px 4px; }
    </style>
</head>
<body>

<div class="layui-fluid" style="padding: 0">
    <form class="layui-form layui-form-pane toolbar-form" id="searchForm" lay-filter="searchForm">
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label" style="width:80px">关键词</label>
                <div class="layui-input-inline" style="width:200px">
                    <input type="text" name="keywords" placeholder="清册题名 / 单号" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width:60px">状态</label>
                <div class="layui-input-inline" style="width:120px">
                    <select name="status">
                        <option value="">全部</option>
                        <option value="草稿">草稿</option>
                        <option value="待审批">待审批</option>
                        <option value="已审批">已审批</option>
                        <option value="已销毁">已销毁</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <button type="button" class="layui-btn layui-btn-primary" id="searchBtn">查询</button>
                <button type="button" class="layui-btn" id="addBtn">新建清册</button>
            </div>
        </div>
    </form>

    <div class="table-box">
        <table class="layui-hide" id="destroyTable" lay-filter="destroyTable"></table>
    </div>
</div>

<!-- 清册表单 -->
<div id="formBox" style="display:none; padding: 14px 12px 4px">
    <form class="layui-form layui-form-pane" id="editForm" lay-filter="editForm">
        <input type="hidden" name="id">
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">销毁单号</label>
                <div class="layui-input-inline" style="width:200px">
                    <input type="text" name="destroyNo" placeholder="如 XH2026-0001" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">门类</label>
                <div class="layui-input-inline" style="width:150px">
                    <select name="category" id="fCategory"></select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">清册题名</label>
                <div class="layui-input-inline" style="width:520px">
                    <input type="text" name="title" class="layui-input" lay-verify="required">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">销毁原因</label>
                <div class="layui-input-inline" style="width:520px">
                    <input type="text" name="reason" placeholder="如 保管期限届满" class="layui-input">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">申请部门</label>
                <div class="layui-input-inline" style="width:150px">
                    <input type="text" name="applyDept" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">申请人</label>
                <div class="layui-input-inline" style="width:120px">
                    <input type="text" name="applicant" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">申请日期</label>
                <div class="layui-input-inline" style="width:150px">
                    <input type="text" name="applyDate" id="fApplyDate" class="layui-input" placeholder="yyyy-MM-dd">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">销毁方式</label>
                <div class="layui-input-inline" style="width:150px">
                    <select name="method">
                        <option value="粉碎">粉碎</option>
                        <option value="焚烧">焚烧</option>
                        <option value="电子数据删除">电子数据删除</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">监销人</label>
                <div class="layui-input-inline" style="width:220px">
                    <input type="text" name="witness" class="layui-input">
                </div>
            </div>
        </div>
        <div class="layui-form-item" style="text-align:right">
            <button type="button" class="layui-btn" lay-submit lay-filter="saveSubmit">保存</button>
            <button type="button" class="layui-btn layui-btn-primary" id="cancelBtn">取消</button>
        </div>
    </form>
</div>

<!-- 明细 -->
<div id="itemBox" style="display:none; padding: 12px">
    <div style="margin-bottom:8px">
        <button type="button" class="layui-btn layui-btn-sm" id="addItemBtn">加入待销毁案卷</button>
        <span class="layui-word-aux">仅「在库 / 封存」状态的案卷可加入</span>
    </div>
    <table class="layui-hide" id="itemTable" lay-filter="itemTable"></table>
</div>

<script type="text/html" id="rowBar">
    <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="items">明细</a>
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="approve">提交 / 审批</a>
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="execute">执行销毁</a>
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</a>
</script>

<script th:src="@{/layui/layui.js}"></script>
<script th:inline="none">
    layui.use(['table', 'form', 'layer', 'jquery', 'laydate'], function () {
        var table = layui.table, form = layui.form, layer = layui.layer,
                $ = layui.jquery, laydate = layui.laydate;

        laydate.render({elem: '#fApplyDate'});
        var currentId = null;

        var tableIns = table.render({
            elem: '#destroyTable', url: '/api/archive/destroy/list', method: 'get',
            page: false, height: 'full-120',
            cols: [[
                {field: 'destroyNo', title: '销毁单号', width: 140},
                {field: 'title', title: '清册题名', minWidth: 240},
                {field: 'category', title: '门类', width: 100},
                {field: 'volumeCount', title: '卷数', width: 70, align: 'right'},
                {field: 'pageCount', title: '页数', width: 80, align: 'right'},
                {field: 'reason', title: '销毁原因', width: 200},
                {field: 'applyDept', title: '申请部门', width: 110},
                {field: 'applicant', title: '申请人', width: 90},
                {field: 'applyDate', title: '申请日期', width: 110},
                {field: 'destroyDate', title: '销毁日期', width: 110},
                {field: 'status', title: '状态', width: 90, align: 'center',
                    templet: function (r) {
                        var map = {'草稿': '', '待审批': 'layui-bg-orange', '已审批': 'layui-bg-blue',
                            '已销毁': 'layui-bg-green'};
                        return '<span class="layui-badge ' + (map[r.status] || '') + '">'
                                + (r.status || '-') + '</span>';
                    }},
                {title: '操作', toolbar: '#rowBar', width: 300, fixed: 'right', align: 'center'}
            ]]
        });

        $.get('/api/archive/category/list', function (res) {
            if (res.code !== 0) return;
            var html = '<option value="">请选择</option>';
            (res.data || []).forEach(function (c) {
                html += '<option value="' + c.categoryName + '">' + c.categoryName + '</option>';
            });
            $('#fCategory').html(html);
            form.render('select');
        });

        $('#searchBtn').on('click', function () {
            tableIns.reload({where: form.val('searchForm')});
        });

        function openForm(data) {
            layer.open({
                type: 1, title: data ? '编辑清册' : '新建销毁清册', area: ['760px', '480px'],
                content: $('#formBox'), success: function () {
                    var val = data || {};
                    form.val('editForm', {
                        id: val.id || '', destroyNo: val.destroyNo || '', category: val.category || '',
                        title: val.title || '', reason: val.reason || '', applyDept: val.applyDept || '',
                        applicant: val.applicant || '', applyDate: val.applyDate || '',
                        method: val.method || '粉碎', witness: val.witness || ''
                    });
                    form.render('select');
                }
            });
        }

        $('#addBtn').on('click', function () { openForm(null); });
        $('#cancelBtn').on('click', function () { layer.closeAll('page'); });

        form.on('submit(saveSubmit)', function (obj) {
            $.ajax({
                url: '/api/archive/destroy/save', type: 'post', contentType: 'application/json',
                data: JSON.stringify(obj.field),
                success: function (res) {
                    if (res.code !== 0) { layer.msg(res.msg || '保存失败'); return; }
                    layer.msg('保存成功');
                    layer.closeAll('page');
                    tableIns.reload();
                }
            });
        });

        // ---------------------------------------------------------------- 明细
        var itemIns = null;

        function renderItems() {
            itemIns = table.render({
                elem: '#itemTable', url: '/api/archive/destroy/items', method: 'get',
                where: {destroyId: currentId}, page: false, height: 330,
                cols: [[
                    {field: 'volumeNo', title: '案卷号', width: 150},
                    {field: 'volumeTitle', title: '案卷题名', minWidth: 240},
                    {field: 'category', title: '门类', width: 100},
                    {field: 'retention', title: '保管期限', width: 90, align: 'center'},
                    {field: 'pageCount', title: '页数', width: 80, align: 'right'},
                    {title: '操作', width: 80, align: 'center',
                        templet: function () {
                            return '<a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="remove">移除</a>';
                        }}
                ]]
            });
        }

        $('#addItemBtn').on('click', function () {
            $.get('/api/archive/volume/list', {limit: 1000}, function (res) {
                if (res.code !== 0) { layer.msg('案卷加载失败'); return; }
                var rows = (res.data || []).filter(function (v) {
                    return v.status === '在库' || v.status === '封存';
                });
                var html = '<div style="padding:12px;max-height:320px;overflow:auto">'
                        + '<table class="layui-table"><thead><tr><th style="width:40px"></th>'
                        + '<th>案卷号</th><th>题名</th><th>门类</th><th>期限</th></tr></thead><tbody>';
                rows.forEach(function (v) {
                    html += '<tr><td><input type="checkbox" name="pick" value="' + v.id + '"></td>'
                            + '<td>' + (v.volumeNo || '') + '</td><td>' + (v.title || '') + '</td>'
                            + '<td>' + (v.category || '') + '</td><td>' + (v.retention || '') + '</td></tr>';
                });
                html += '</tbody></table></div>';
                layer.open({
                    type: 1, title: '选择待销毁案卷', area: ['700px', '460px'], content: html,
                    btn: ['加入', '取消'],
                    yes: function (index) {
                        var ids = [];
                        $('input[name=pick]:checked').each(function () {
                            ids.push(Number($(this).val()));
                        });
                        if (!ids.length) { layer.msg('请先勾选案卷'); return; }
                        $.ajax({
                            url: '/api/archive/destroy/add-items?destroyId=' + currentId,
                            type: 'post', contentType: 'application/json', data: JSON.stringify(ids),
                            success: function (r) {
                                if (r.code !== 0) { layer.msg(r.msg || '加入失败'); return; }
                                layer.msg(r.data || '已加入');
                                layer.close(index);
                                renderItems();
                                tableIns.reload();
                            }
                        });
                    }
                });
            });
        });

        table.on('tool(itemTable)', function (obj) {
            if (obj.event === 'remove') {
                $.post('/api/archive/destroy/remove-item', {id: obj.data.id}, function (res) {
                    if (res.code !== 0) { layer.msg(res.msg || '移除失败'); return; }
                    renderItems();
                    tableIns.reload();
                });
            }
        });

        // ---------------------------------------------------------------- 行操作
        table.on('tool(destroyTable)', function (obj) {
            var row = obj.data;
            if (obj.event === 'edit') {
                openForm(row);
            } else if (obj.event === 'items') {
                currentId = row.id;
                layer.open({
                    type: 1, title: '销毁明细 - ' + row.destroyNo,
                    area: ['860px', '480px'], content: $('#itemBox'),
                    success: function () { renderItems(); }
                });
            } else if (obj.event === 'approve') {
                if (row.status === '已销毁') { layer.msg('该清册已销毁'); return; }
                var tip = row.status === '草稿' ? '确认提交审批？' : '确认审批通过？审批后案卷将封存待销毁。';
                layer.confirm(tip, function (index) {
                    $.post('/api/archive/destroy/approve', {id: row.id}, function (res) {
                        if (res.code !== 0) { layer.msg(res.msg || '操作失败'); return; }
                        layer.msg('当前状态：' + res.data);
                        layer.close(index);
                        tableIns.reload();
                    });
                });
            } else if (obj.event === 'execute') {
                layer.confirm('确认执行销毁？案卷将置为「已销毁」，此操作不可撤销。', function (index) {
                    $.post('/api/archive/destroy/execute', {id: row.id}, function (res) {
                        if (res.code !== 0) { layer.msg(res.msg || '操作失败'); return; }
                        layer.msg(res.data || '已销毁');
                        layer.close(index);
                        tableIns.reload();
                    });
                });
            } else if (obj.event === 'del') {
                layer.confirm('确认删除清册「' + row.title + '」？明细将一并删除。', function (index) {
                    $.post('/api/archive/destroy/delete', {id: row.id}, function (res) {
                        if (res.code !== 0) { layer.msg(res.msg || '删除失败'); return; }
                        layer.msg('已删除');
                        layer.close(index);
                        tableIns.reload();
                    });
                });
            }
        });
    });
</script>
</body>
</html>
