<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>案卷管理</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/layui/css/layui.css}" rel="stylesheet">
    <link th:href="@{/admin/admin-ui/css/admin.css}" rel="stylesheet">
    <link th:href="@{/css/kdesign.css}" rel="stylesheet">
    <style>
        body { background: #F2F2F2; padding: 12px; }
        .toolbar-form { background: #fff; padding: 12px 12px 0; border-radius: 4px 4px 0 0; }
        .table-box { background: #fff; padding: 8px; border-radius: 0 0 4px 4px; }
        .v-red { color: #FB2323; }
    </style>
</head>
<body>

<div class="layui-fluid" style="padding: 0">
    <form class="layui-form layui-form-pane toolbar-form" id="searchForm" lay-filter="searchForm">
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label" style="width:80px">关键词</label>
                <div class="layui-input-inline" style="width:180px">
                    <input type="text" name="keywords" placeholder="题名 / 案卷号 / 立卷人" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width:60px">门类</label>
                <div class="layui-input-inline" style="width:130px">
                    <select name="category" id="sCategory"><option value="">全部</option></select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width:60px">状态</label>
                <div class="layui-input-inline" style="width:120px">
                    <select name="status" id="sStatus">
                        <option value="">全部</option>
                        <option value="在库">在库</option>
                        <option value="借阅中">借阅中</option>
                        <option value="封存">封存</option>
                        <option value="已销毁">已销毁</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width:80px">保管期限</label>
                <div class="layui-input-inline" style="width:120px">
                    <select name="retention" id="sRetention">
                        <option value="">全部</option>
                        <option value="永久">永久</option>
                        <option value="30年">30年</option>
                        <option value="10年">10年</option>
                        <option value="5年">5年</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width:60px">年度</label>
                <div class="layui-input-inline" style="width:110px">
                    <select name="year" id="sYear"><option value="">全部</option></select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width:70px">办公室</label>
                <div class="layui-input-inline" style="width:170px">
                    <select name="officeRoom" id="sOffice" lay-filter="sOffice"><option value="">全部</option></select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width:60px">柜号</label>
                <div class="layui-input-inline" style="width:180px">
                    <select name="cabinetNo" id="sCabinet" lay-filter="sCabinet"><option value="">全部</option></select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" style="width:70px">文件夹</label>
                <div class="layui-input-inline" style="width:180px">
                    <select name="locationCode" id="sLocation" lay-filter="sLocation"><option value="">全部</option></select>
                </div>
            </div>
            <div class="layui-inline">
                <button type="button" class="layui-btn layui-btn-primary" id="searchBtn">查询</button>
                <button type="button" class="layui-btn layui-btn-primary" id="resetBtn">重置</button>
                <button type="button" class="layui-btn" id="addBtn">新增案卷</button>
            </div>
        </div>
    </form>

    <div class="table-box">
        <table class="layui-hide" id="volumeTable" lay-filter="volumeTable"></table>
    </div>
</div>

<!-- 案卷表单 -->
<div id="formBox" style="display:none; padding: 14px 12px 4px">
    <form class="layui-form layui-form-pane" id="editForm" lay-filter="editForm">
        <input type="hidden" name="id">
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">案卷号</label>
                <div class="layui-input-inline" style="width:220px">
                    <input type="text" name="volumeNo" placeholder="如 2026-WS-001" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">门类</label>
                <div class="layui-input-inline" style="width:150px">
                    <select name="category" id="fCategory"></select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">年度</label>
                <div class="layui-input-inline" style="width:110px">
                    <input type="number" name="year" class="layui-input">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">案卷题名</label>
                <div class="layui-input-inline" style="width:620px">
                    <input type="text" name="title" class="layui-input" lay-verify="required">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">保管期限</label>
                <div class="layui-input-inline" style="width:110px">
                    <select name="retention">
                        <option value="永久">永久</option>
                        <option value="30年">30年</option>
                        <option value="10年">10年</option>
                        <option value="5年">5年</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">密级</label>
                <div class="layui-input-inline" style="width:110px">
                    <select name="security">
                        <option value="公开">公开</option>
                        <option value="内部">内部</option>
                        <option value="秘密">秘密</option>
                        <option value="机密">机密</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">载体</label>
                <div class="layui-input-inline" style="width:110px">
                    <select name="carrier">
                        <option value="纸质">纸质</option>
                        <option value="电子">电子</option>
                        <option value="声像">声像</option>
                        <option value="实物">实物</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">状态</label>
                <div class="layui-input-inline" style="width:110px">
                    <select name="status">
                        <option value="在库">在库</option>
                        <option value="借阅中">借阅中</option>
                        <option value="封存">封存</option>
                        <option value="已销毁">已销毁</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">起始日期</label>
                <div class="layui-input-inline" style="width:150px">
                    <input type="text" name="startDate" id="fStart" class="layui-input" placeholder="yyyy-MM-dd">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">截止日期</label>
                <div class="layui-input-inline" style="width:150px">
                    <input type="text" name="endDate" id="fEnd" class="layui-input" placeholder="yyyy-MM-dd">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">归档日期</label>
                <div class="layui-input-inline" style="width:150px">
                    <input type="text" name="archiveDate" id="fArchive" class="layui-input" placeholder="yyyy-MM-dd">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">归档部门</label>
                <div class="layui-input-inline" style="width:150px">
                    <input type="text" name="archiveDept" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">立卷人</label>
                <div class="layui-input-inline" style="width:110px">
                    <input type="text" name="archivist" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">盒号</label>
                <div class="layui-input-inline" style="width:100px">
                    <input type="text" name="boxNo" class="layui-input">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">办公室</label>
                <div class="layui-input-inline" style="width:180px">
                    <select name="officeRoom" id="fOffice" lay-filter="fOffice"><option value="">请选择</option></select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">柜号</label>
                <div class="layui-input-inline" style="width:200px">
                    <select name="cabinetNo" id="fCabinet" lay-filter="fCabinet"><option value="">请选择</option></select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">文件夹</label>
                <div class="layui-input-inline" style="width:220px">
                    <select name="locationCode" id="fLocation" lay-filter="fLocation"><option value="">请选择</option></select>
                </div>
            </div>
        </div>
        <div class="layui-form-item" style="margin-top:-6px">
            <div class="layui-input-block" style="margin-left:110px">
                <span class="layui-word-aux">存放位置：</span><span id="fLocPath" style="color:#2386EE">未选择</span>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-inline" style="width:620px">
                    <input type="text" name="remark" class="layui-input">
                </div>
            </div>
        </div>
        <div class="layui-form-item" style="text-align:right">
            <button type="button" class="layui-btn" lay-submit lay-filter="saveSubmit">保存</button>
            <button type="button" class="layui-btn layui-btn-primary" id="cancelBtn">取消</button>
        </div>
    </form>
</div>

<!-- 卷内文件 -->
<div id="fileBox" style="display:none; padding: 12px">
    <table class="layui-hide" id="fileTable"></table>
</div>

<script type="text/html" id="rowBar">
    <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="files">卷内文件</a>
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</a>
</script>

<script th:src="@{/layui/layui.js}"></script>
<script th:inline="none">
    layui.use(['table', 'form', 'layer', 'jquery', 'laydate'], function () {
        var table = layui.table, form = layui.form, layer = layui.layer,
                $ = layui.jquery, laydate = layui.laydate;

        laydate.render({elem: '#fStart'});
        laydate.render({elem: '#fEnd'});
        laydate.render({elem: '#fArchive'});

        var tableIns = table.render({
            elem: '#volumeTable', url: '/api/archive/volume/list', method: 'get',
            page: {limit: 20, limits: [20, 50, 100]}, height: 'full-140',
            cols: [[
                {field: 'volumeNo', title: '案卷号', width: 150, sort: true},
                {field: 'title', title: '案卷题名', minWidth: 240},
                {field: 'category', title: '门类', width: 100},
                {field: 'year', title: '年度', width: 70, align: 'center', sort: true},
                {field: 'retention', title: '保管期限', width: 90, align: 'center'},
                {field: 'security', title: '密级', width: 70, align: 'center',
                    templet: function (r) {
                        if (r.security === '秘密' || r.security === '机密') {
                            return '<span class="v-red">' + r.security + '</span>';
                        }
                        return r.security || '-';
                    }},
                {field: 'fileCount', title: '件数', width: 70, align: 'right'},
                {field: 'pageCount', title: '页数', width: 80, align: 'right'},
                {field: 'archiveDept', title: '归档部门', width: 110},
                {field: 'archivist', title: '立卷人', width: 80},
                {field: 'archiveDate', title: '归档日期', width: 110},
                {field: 'locationName', title: '存放位置（办公室/柜/层/文件夹）', minWidth: 260,
                    templet: function (r) {
                        if (r.locationName) return r.locationName;
                        if (r.locationCode) return r.locationCode;
                        return '<span style="color:#bbb">未定位</span>';
                    }},
                {field: 'borrowTimes', title: '借阅次数', width: 90, align: 'right'},
                {field: 'status', title: '状态', width: 80, align: 'center',
                    templet: function (r) {
                        var map = {'在库': 'layui-bg-green', '借阅中': 'layui-bg-orange',
                            '封存': 'layui-bg-blue', '已销毁': ''};
                        return '<span class="layui-badge ' + (map[r.status] || '') + '">'
                                + (r.status || '-') + '</span>';
                    }},
                {title: '操作', toolbar: '#rowBar', width: 200, fixed: 'right', align: 'center'}
            ]]
        });

        // ---------------------------------------------------------------- 下拉数据
        var locList = [];

        function loadOptions(done) {
            $.get('/api/archive/volume/options', function (res) {
                if (res.code !== 0) return;
                var d = res.data || {};
                locList = d.locationOptions || [];
                fill('#sCategory', d.categories);
                fill('#sYear', d.years);
                fill('#sOffice', d.offices);
                fill('#fOffice', d.offices);
                fill('#fCategory', d.categories);
                fillCabinets('#sCabinet', $('#sOffice').val());
                fillCabinets('#fCabinet', $('#fOffice').val());
                fillFolders('#sLocation', $('#fOffice').val(), $('#fCabinet').val());
                fillFolders('#fLocation', $('#fOffice').val(), $('#fCabinet').val());
                form.render('select');
                if (done) done();
            });
        }

        function fill(sel, list) {
            var $sel = $(sel), cur = $sel.data('cur') || '';
            var html = '<option value="">全部</option>';
            (list || []).forEach(function (v) {
                if (v === null || v === undefined) return;
                html += '<option value="' + v + '"' + (String(v) === String(cur) ? ' selected' : '')
                        + '>' + v + '</option>';
            });
            $sel.html(html);
        }

        /** 柜号下拉：按办公室过滤。 */
        function fillCabinets(sel, office) {
            var set = {}, arr = [];
            locList.forEach(function (l) {
                if (office && l.officeRoom !== office) return;
                if (l.cabinetNo && !set[l.cabinetNo]) { set[l.cabinetNo] = 1; arr.push(l.cabinetNo); }
            });
            var html = '<option value="">全部</option>';
            arr.forEach(function (v) { html += '<option value="' + v + '">' + v + '</option>'; });
            $(sel).html(html);
        }

        /** 文件夹（具体位置）下拉：按办公室 + 柜号过滤，值取位置编号。 */
        function fillFolders(sel, office, cabinet) {
            var html = '<option value="">全部</option>';
            locList.forEach(function (l) {
                if (office && l.officeRoom !== office) return;
                if (cabinet && l.cabinetNo !== cabinet) return;
                var label = (l.layerNo ? l.layerNo + ' ' : '') + (l.folderNo || l.locationCode);
                html += '<option value="' + l.locationCode + '">' + label + '</option>';
            });
            $(sel).html(html);
        }

        function locationPathOf(code) {
            for (var i = 0; i < locList.length; i++) {
                if (locList[i].locationCode === code) return locList[i].locationPath;
            }
            return '';
        }

        loadOptions(function () {
            // 支持从位置导航页带参跳转：?locationCode= / ?officeRoom= / ?cabinetNo= / ?folderNo=
            var qs = new URLSearchParams(location.search);
            var where = {};
            ['locationCode', 'officeRoom', 'cabinetNo', 'folderNo'].forEach(function (k) {
                var v = qs.get(k);
                if (v) where[k] = v;
            });
            if (Object.keys(where).length === 0) return;
            if (where.officeRoom) {
                $('#sOffice').val(where.officeRoom);
                fillCabinets('#sCabinet', where.officeRoom);
            }
            if (where.cabinetNo) { $('#sCabinet').val(where.cabinetNo); }
            fillFolders('#sLocation', where.officeRoom || $('#sOffice').val(),
                    where.cabinetNo || $('#sCabinet').val());
            if (where.locationCode) { $('#sLocation').val(where.locationCode); }
            form.val('searchForm', where);
            form.render('select');
            tableIns.reload({where: where, page: {curr: 1}});
        });

        // 查询区级联
        form.on('select(sOffice)', function (data) {
            fillCabinets('#sCabinet', data.value);
            fillFolders('#sLocation', data.value, '');
            form.render('select');
        });
        form.on('select(sCabinet)', function (data) {
            fillFolders('#sLocation', $('#sOffice').val(), data.value);
            form.render('select');
        });

        // 表单区级联
        form.on('select(fOffice)', function (data) {
            fillCabinets('#fCabinet', data.value);
            fillFolders('#fLocation', data.value, '');
            $('#fLocPath').text('未选择');
            form.render('select');
        });
        form.on('select(fCabinet)', function (data) {
            fillFolders('#fLocation', $('#fOffice').val(), data.value);
            $('#fLocPath').text('未选择');
            form.render('select');
        });
        form.on('select(fLocation)', function (data) {
            $('#fLocPath').text(data.value ? locationPathOf(data.value) : '未选择');
        });

        // ---------------------------------------------------------------- 查询
        $('#searchBtn').on('click', function () {
            tableIns.reload({where: form.val('searchForm'), page: {curr: 1}});
        });
        $('#resetBtn').on('click', function () {
            form.val('searchForm', {keywords: '', category: '', status: '', retention: '',
                year: '', officeRoom: '', cabinetNo: '', locationCode: '', folderNo: ''});
            fillCabinets('#sCabinet', '');
            fillFolders('#sLocation', '', '');
            form.render('select');
            tableIns.reload({where: {}, page: {curr: 1}});
        });

        // ---------------------------------------------------------------- 新增 / 编辑
        function openForm(data) {
            layer.open({
                type: 1, title: data ? '编辑案卷' : '新增案卷', area: ['780px', '650px'],
                content: $('#formBox'), success: function () {
                    var val = data || {};
                    if (!val.archiveDate) val.archiveDate = '';
                    // 先把级联下拉准备好，再回填值，否则 select 选项还没生成
                    fillCabinets('#fCabinet', val.officeRoom || '');
                    fillFolders('#fLocation', val.officeRoom || '', val.cabinetNo || '');
                    form.val('editForm', {
                        id: val.id || '', volumeNo: val.volumeNo || '', category: val.category || '',
                        year: val.year || new Date().getFullYear(), title: val.title || '',
                        retention: val.retention || '30年', security: val.security || '内部',
                        carrier: val.carrier || '纸质', status: val.status || '在库',
                        startDate: val.startDate || '', endDate: val.endDate || '',
                        archiveDate: val.archiveDate || '', archiveDept: val.archiveDept || '',
                        archivist: val.archivist || '', officeRoom: val.officeRoom || '',
                        cabinetNo: val.cabinetNo || '', locationCode: val.locationCode || '',
                        boxNo: val.boxNo || '', remark: val.remark || ''
                    });
                    $('#fLocPath').text(val.locationName || locationPathOf(val.locationCode) || '未选择');
                    form.render('select');
                }
            });
        }

        $('#addBtn').on('click', function () { openForm(null); });
        $('#cancelBtn').on('click', function () { layer.closeAll('page'); });

        form.on('submit(saveSubmit)', function (obj) {
            var data = obj.field;
            if (data.year) data.year = Number(data.year);
            $.ajax({
                url: '/api/archive/volume/save', type: 'post', contentType: 'application/json',
                data: JSON.stringify(data),
                success: function (res) {
                    if (res.code !== 0) { layer.msg(res.msg || '保存失败'); return; }
                    layer.msg('保存成功');
                    layer.closeAll('page');
                    tableIns.reload();
                }
            });
        });

        // ---------------------------------------------------------------- 行操作
        table.on('tool(volumeTable)', function (obj) {
            var row = obj.data;
            if (obj.event === 'edit') {
                openForm(row);
            } else if (obj.event === 'del') {
                layer.confirm('确认删除案卷「' + row.title + '」？卷内文件将一并删除。',
                        function (index) {
                            $.post('/api/archive/volume/delete', {id: row.id}, function (res) {
                                if (res.code !== 0) { layer.msg(res.msg || '删除失败'); return; }
                                layer.msg('已删除');
                                layer.close(index);
                                tableIns.reload();
                            });
                        });
            } else if (obj.event === 'files') {
                layer.open({
                    type: 1, title: '卷内文件 - ' + row.volumeNo + ' ' + row.title,
                    area: ['860px', '480px'], content: $('#fileBox'),
                    success: function () {
                        table.render({
                            elem: '#fileTable', url: '/api/archive/volume/files', method: 'get',
                            where: {volumeId: row.id}, page: false, height: 360,
                            cols: [[
                                {field: 'itemNo', title: '件号', width: 60, align: 'center'},
                                {field: 'docNo', title: '文号', width: 160},
                                {field: 'title', title: '文件题名', minWidth: 240},
                                {field: 'responsible', title: '责任者', width: 120},
                                {field: 'docDate', title: '成文日期', width: 110},
                                {field: 'pageCount', title: '页数', width: 70, align: 'right'},
                                {field: 'pageNo', title: '页号', width: 90}
                            ]]
                        });
                    }
                });
            }
        });
    });
</script>
</body>
</html>
