<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>核算部门</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/layui/css/layui.css}" rel="stylesheet">
    <link th:href="@{/admin/admin-ui/css/admin.css}" rel="stylesheet">
    <style>
        body { background: #f2f3f5; padding: 12px; }
        .search-bar { background: #fff; padding: 12px 14px 2px; border-radius: 4px; margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="layui-fluid" style="padding: 0">

    <div class="search-bar">
        <form class="layui-form" id="searchForm" lay-filter="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <div class="layui-input-inline" style="width:220px">
                        <input type="text" name="keywords" placeholder="部门名称 / 编码 / 负责人"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn layui-btn-sm" lay-submit lay-filter="search">查询</button>
                    <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm" id="resetBtn">重置</button>
                </div>
            </div>
        </form>
    </div>

    <div class="layui-card">
        <div class="layui-card-body">
            <table class="layui-hide" id="deptTable" lay-filter="deptTable"></table>
        </div>
    </div>

</div>

<script type="text/html" id="deptToolbar">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="add">新增部门</button>
    </div>
</script>

<script type="text/html" id="deptRowBar">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</a>
</script>

<div id="deptFormWrap" style="display:none;padding:16px 18px 0">
    <form class="layui-form" id="deptForm" lay-filter="deptForm">
        <input type="hidden" name="id">

        <div class="layui-form-item">
            <label class="layui-form-label">部门编码</label>
            <div class="layui-input-block">
                <input type="text" name="deptCode" lay-verify="required" placeholder="如 BM-11"
                       autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">部门名称</label>
            <div class="layui-input-block">
                <input type="text" name="deptName" lay-verify="required" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">部门类型</label>
                    <div class="layui-input-block">
                        <select name="deptType">
                            <option value="管理部门">管理部门</option>
                            <option value="生产车间">生产车间</option>
                            <option value="辅助部门">辅助部门</option>
                            <option value="经营层">经营层</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">负责人</label>
                    <div class="layui-input-block">
                        <input type="text" name="leader" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">在册人数</label>
                    <div class="layui-input-block">
                        <input type="number" name="headcount" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">月度定额</label>
                    <div class="layui-input-block">
                        <input type="number" name="monthQuota" step="0.01" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-block">
                        <select name="status">
                            <option value="启用">启用</option>
                            <option value="停用">停用</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">备注</label>
            <div class="layui-input-block">
                <input type="text" name="remark" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item" style="text-align:right">
            <button class="layui-btn" lay-submit lay-filter="deptSubmit">保存</button>
            <button type="button" class="layui-btn layui-btn-primary" id="cancelBtn">取消</button>
        </div>
    </form>
</div>

<script th:src="@{/layui/layui.js}"></script>
<script th:inline="none">
    layui.use(['table', 'form', 'layer', 'jquery'], function () {
        var table = layui.table;
        var form = layui.form;
        var layer = layui.layer;
        var $ = layui.jquery;

        var layerIndex = null;
        form.render();

        function money(v) {
            if (v === null || v === undefined || v === '') return '-';
            var n = Number(v);
            if (isNaN(n)) return v;
            return n.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        table.render({
            elem: '#deptTable',
            url: '/api/salary/dept/list',
            method: 'get',
            toolbar: '#deptToolbar',
            defaultToolbar: ['filter', 'exports'],
            page: true,
            limit: 20,
            limits: [20, 50],
            cols: [[
                {field: 'deptCode', title: '部门编码', width: 110, sort: true},
                {field: 'deptName', title: '部门名称', minWidth: 160},
                {field: 'deptType', title: '部门类型', width: 110, align: 'center'},
                {field: 'leader', title: '负责人', width: 110},
                {field: 'headcount', title: '在册人数', width: 100, align: 'center', sort: true,
                    templet: function (r) {
                        return '<span style="font-weight:600">' + (r.headcount || 0) + '</span>';
                    }},
                {field: 'monthQuota', title: '月度工资定额(元)', width: 150, align: 'right', sort: true,
                    templet: function (r) { return money(r.monthQuota); }},
                {field: 'remark', title: '备注', minWidth: 160},
                {field: 'status', title: '状态', width: 90, align: 'center',
                    templet: function (r) {
                        return r.status === '启用'
                            ? '<span class="layui-badge layui-bg-green">启用</span>'
                            : '<span class="layui-badge">停用</span>';
                    }},
                {title: '操作', width: 130, fixed: 'right', toolbar: '#deptRowBar'}
            ]]
        });

        form.on('submit(search)', function (obj) {
            table.reload('deptTable', {where: obj.field, page: {curr: 1}});
            return false;
        });

        $('#resetBtn').on('click', function () {
            setTimeout(function () {
                table.reload('deptTable', {where: {keywords: ''}, page: {curr: 1}});
            }, 10);
        });

        table.on('toolbar(deptTable)', function (obj) {
            if (obj.event === 'add') {
                openForm(null);
            }
        });

        table.on('tool(deptTable)', function (obj) {
            var row = obj.data;
            if (obj.event === 'edit') {
                openForm(row);
            } else if (obj.event === 'del') {
                layer.confirm('确认删除部门「' + row.deptName + '」？', function (i) {
                    layer.close(i);
                    $.post('/api/salary/dept/delete', {id: row.id}, function (res) {
                        layer.msg(res.code === 0 ? '已删除' : (res.msg || '删除失败'));
                        table.reload('deptTable');
                    });
                });
            }
        });

        function openForm(row) {
            var d = row || {};
            form.val('deptForm', {
                id: d.id || '',
                deptCode: d.deptCode || '',
                deptName: d.deptName || '',
                deptType: d.deptType || '管理部门',
                leader: d.leader || '',
                headcount: d.headcount || 0,
                monthQuota: d.monthQuota === null || d.monthQuota === undefined ? '' : d.monthQuota,
                status: d.status || '启用',
                remark: d.remark || ''
            });
            layerIndex = layer.open({
                type: 1,
                title: row ? '编辑部门' : '新增部门',
                area: ['640px', '480px'],
                content: $('#deptFormWrap'),
                end: function () { layerIndex = null; }
            });
        }

        $('#cancelBtn').on('click', function () {
            layer.close(layerIndex);
        });

        form.on('submit(deptSubmit)', function (obj) {
            var f = obj.field;
            var payload = {
                id: f.id ? Number(f.id) : null,
                deptCode: f.deptCode,
                deptName: f.deptName,
                deptType: f.deptType,
                leader: f.leader,
                headcount: f.headcount === '' ? 0 : Number(f.headcount),
                monthQuota: f.monthQuota === '' ? 0 : Number(f.monthQuota),
                status: f.status,
                remark: f.remark
            };
            $.ajax({
                url: '/api/salary/dept/save',
                type: 'post',
                contentType: 'application/json',
                data: JSON.stringify(payload),
                success: function (res) {
                    if (res.code !== 0) {
                        layer.msg(res.msg || '保存失败');
                        return;
                    }
                    layer.close(layerIndex);
                    layer.msg('已保存');
                    table.reload('deptTable');
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
