<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>工资下拨</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/layui/css/layui.css}" rel="stylesheet">
    <link th:href="@{/admin/admin-ui/css/admin.css}" rel="stylesheet">
    <style>
        body { background: #f2f3f5; padding: 12px; }
        .search-bar { background: #fff; padding: 12px 14px 2px; border-radius: 4px; margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="layui-fluid" style="padding: 0">

    <div class="search-bar">
        <form class="layui-form" id="searchForm" lay-filter="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label" style="width:60px">年度</label>
                    <div class="layui-input-inline" style="width:100px">
                        <select name="year" id="yearSel">
                            <option value="">全部</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label" style="width:60px">月份</label>
                    <div class="layui-input-inline" style="width:90px">
                        <select name="month" id="monthSel">
                            <option value="">全部</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <div class="layui-input-inline" style="width:140px">
                        <select name="deptName" id="deptSel">
                            <option value="">全部部门</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <div class="layui-input-inline" style="width:140px">
                        <select name="allocType">
                            <option value="">全部下拨类型</option>
                            <option value="月度工资总额">月度工资总额</option>
                            <option value="奖金专项">奖金专项</option>
                            <option value="年终兑现">年终兑现</option>
                            <option value="专项补贴">专项补贴</option>
                            <option value="补拨">补拨</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <div class="layui-input-inline" style="width:120px">
                        <select name="status" id="statusSel">
                            <option value="">全部状态</option>
                            <option value="待下拨">待下拨</option>
                            <option value="已下拨">已下拨</option>
                            <option value="部分使用">部分使用</option>
                            <option value="已结算">已结算</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <div class="layui-input-inline" style="width:200px">
                        <input type="text" name="keywords" placeholder="单号 / 部门 / 文号 / 拨付单位 / 经办人"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn layui-btn-sm" lay-submit lay-filter="search">查询</button>
                    <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm" id="resetBtn">重置</button>
                </div>
            </div>
        </form>
    </div>

    <div class="layui-card">
        <div class="layui-card-body">
            <table class="layui-hide" id="allocTable" lay-filter="allocTable"></table>
        </div>
    </div>

</div>

<!-- 工具条 -->
<script type="text/html" id="allocToolbar">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="add">新增下拨单</button>
        <button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="generate">按部门生成</button>
        <button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="refresh">重算结余</button>
    </div>
</script>

<script type="text/html" id="allocRowBar">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    {{#  if(d.status === '待下拨'){ }}
    <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="post">确认下拨</a>
    {{#  } }}
    <a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="reports">上报单</a>
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</a>
</script>

<!-- 表单弹窗 -->
<div id="allocFormWrap" style="display:none;padding:16px 18px 0">
    <form class="layui-form" id="allocForm" lay-filter="allocForm">
        <input type="hidden" name="id">

        <div class="layui-row layui-col-space10">
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">下拨单号</label>
                    <div class="layui-input-block">
                        <input type="text" name="allocNo" lay-verify="required" placeholder="如 XB2026-09"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">年度</label>
                    <div class="layui-input-block">
                        <input type="number" name="periodYear" id="formYear" lay-verify="required"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">月份</label>
                    <div class="layui-input-block">
                        <select name="periodMonth" id="formMonth"></select>
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-row layui-col-space10">
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">下拨部门</label>
                    <div class="layui-input-block">
                        <select name="deptName" id="formDeptSel" lay-verify="required"></select>
                    </div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">下拨类型</label>
                    <div class="layui-input-block">
                        <select name="allocType">
                            <option value="月度工资总额">月度工资总额</option>
                            <option value="奖金专项">奖金专项</option>
                            <option value="年终兑现">年终兑现</option>
                            <option value="专项补贴">专项补贴</option>
                            <option value="补拨">补拨</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">下拨日期</label>
                    <div class="layui-input-block">
                        <input type="text" name="allocDate" id="allocDate" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">经办人</label>
                    <div class="layui-input-block">
                        <input type="text" name="handler" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">拨付单位</label>
            <div class="layui-input-block">
                <input type="text" name="sourceUnit" placeholder="上级单位，如 招金有色金属集团有限公司"
                       autocomplete="off" class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">接收单位</label>
            <div class="layui-input-block">
                <input type="text" name="targetUnit" autocomplete="off" class="layui-input">
            </div>
        </div>

        <div class="layui-row layui-col-space10">
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">核定总额</label>
                    <div class="layui-input-block">
                        <input type="number" name="approvedAmount" step="0.01" placeholder="元"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">下拨金额</label>
                    <div class="layui-input-block">
                        <input type="number" name="allocAmount" step="0.01" placeholder="元"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-block">
                        <select name="status">
                            <option value="待下拨">待下拨</option>
                            <option value="已下拨">已下拨</option>
                            <option value="部分使用">部分使用</option>
                            <option value="已结算">已结算</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">拨付文号</label>
            <div class="layui-input-block">
                <input type="text" name="voucherNo" placeholder="如 招金有色人发〔2026〕9号"
                       autocomplete="off" class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">备注</label>
            <div class="layui-input-block">
                <textarea name="remark" placeholder="下拨说明" class="layui-textarea"></textarea>
            </div>
        </div>

        <div class="layui-form-item" style="text-align:right">
            <button class="layui-btn" lay-submit lay-filter="allocSubmit">保存</button>
            <button type="button" class="layui-btn layui-btn-primary" id="cancelBtn">取消</button>
        </div>
    </form>
</div>

<!-- 按部门生成下拨单 -->
<div id="genWrap" style="display:none;padding:18px">
    <form class="layui-form" id="genForm" lay-filter="genForm">
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">年度</label>
                    <div class="layui-input-block">
                        <input type="number" name="year" id="genYear" lay-verify="required" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">月份</label>
                    <div class="layui-input-block">
                        <select name="month" id="genMonth"></select>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">核定总额</label>
                    <div class="layui-input-block">
                        <input type="number" name="approved" step="0.01" lay-verify="required"
                               placeholder="上级批复的当月工资总额" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">下拨金额</label>
                    <div class="layui-input-block">
                        <input type="number" name="amount" step="0.01" placeholder="留空同核定总额"
                               class="layui-input">
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">分摊方式</label>
            <div class="layui-input-block">
                <input type="radio" name="mode" value="quota" title="按部门工资定额" checked>
                <input type="radio" name="mode" value="headcount" title="按在册人数">
                <input type="radio" name="mode" value="avg" title="平均分摊">
            </div>
        </div>
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">下拨日期</label>
                    <div class="layui-input-block">
                        <input type="text" name="allocDate" id="genDate" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">拨付文号</label>
                    <div class="layui-input-block">
                        <input type="text" name="voucherNo" placeholder="选填" class="layui-input">
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block" style="margin-left:0">
                <div class="layui-word-aux" style="font-size:12px;line-height:1.8">
                    按各核算部门的工资定额（或在册人数）把当月总额分解到部门下拨单，单号形如
                    XB2026-09-01；同一部门同一期间已存在下拨单时只更新金额，不重复新增。
                </div>
            </div>
        </div>
        <div class="layui-form-item" style="text-align:right">
            <button class="layui-btn" lay-submit lay-filter="genSubmit">生成</button>
            <button type="button" class="layui-btn layui-btn-primary" id="genCancelBtn">取消</button>
        </div>
    </form>
</div>

<script th:src="@{/layui/layui.js}"></script>
<script th:inline="none">
    layui.use(['table', 'form', 'layer', 'laydate', 'jquery'], function () {
        var table = layui.table;
        var form = layui.form;
        var layer = layui.layer;
        var laydate = layui.laydate;
        var $ = layui.jquery;

        var layerIndex = null;
        var genIndex = null;
        var defaultStatus = getQuery('status');

        // 年度 / 月份下拉
        var thisYear = new Date().getFullYear();
        var yearHtml = '';
        for (var y = thisYear + 1; y >= thisYear - 3; y--) {
            yearHtml += '<option value="' + y + '">' + y + '</option>';
        }
        $('#yearSel').append(yearHtml);
        var monthHtml = '';
        for (var m = 1; m <= 12; m++) {
            monthHtml += '<option value="' + m + '">' + m + ' 月</option>';
        }
        $('#monthSel').append(monthHtml);
        $('#formMonth').html(monthHtml);
        $('#genMonth').html(monthHtml);
        $('#genYear').val(thisYear);
        $('#genMonth').val(new Date().getMonth() + 1);
        if (defaultStatus) {
            $('#statusSel').val(defaultStatus);
        }
        form.render();
        laydate.render({elem: '#allocDate', value: new Date()});
        laydate.render({elem: '#genDate', value: new Date()});

        // 部门下拉
        $.get('/api/salary/dept/all', function (res) {
            var list = (res.code === 0 && res.data) ? res.data : [];
            var opts = list.map(function (d) {
                return '<option value="' + d.deptName + '">' + d.deptName + '</option>';
            }).join('');
            $('#deptSel').append(opts);
            $('#formDeptSel').append(opts);
            form.render('select');
        });

        function money(v) {
            if (v === null || v === undefined || v === '') return '-';
            var n = Number(v);
            if (isNaN(n)) return v;
            return n.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        // ---------------------------------------------------------- 列表
        table.render({
            elem: '#allocTable',
            url: '/api/salary/alloc/list',
            method: 'get',
            toolbar: '#allocToolbar',
            defaultToolbar: ['filter', 'exports'],
            page: true,
            limit: 15,
            limits: [15, 30, 50],
            where: {status: defaultStatus || ''},
            cols: [[
                {field: 'allocNo', title: '下拨单号', width: 130, sort: true},
                {
                    field: 'periodMonth', title: '期间', width: 90, align: 'center',
                    templet: function (r) {
                        return r.periodYear + '-' + (r.periodMonth < 10 ? '0' + r.periodMonth : r.periodMonth);
                    }
                },
                {field: 'deptName', title: '下拨部门', width: 110},
                {field: 'allocType', title: '下拨类型', width: 110},
                {field: 'headcount', title: '人数', width: 70, align: 'center'},
                {field: 'sourceUnit', title: '拨付单位', minWidth: 200},
                {field: 'approvedAmount', title: '核定总额(元)', width: 130, align: 'right', sort: true,
                    templet: function (r) { return money(r.approvedAmount); }},
                {field: 'allocAmount', title: '下拨金额(元)', width: 130, align: 'right', sort: true,
                    templet: function (r) {
                        return '<span style="color:#2f7ef7;font-weight:600">' + money(r.allocAmount) + '</span>';
                    }},
                {field: 'usedAmount', title: '已发放(元)', width: 120, align: 'right',
                    templet: function (r) { return money(r.usedAmount); }},
                {field: 'balanceAmount', title: '结余(元)', width: 120, align: 'right',
                    templet: function (r) {
                        var c = Number(r.balanceAmount || 0) > 0 ? '#18a058' : '#e13c3c';
                        return '<span style="color:' + c + '">' + money(r.balanceAmount) + '</span>';
                    }},
                {field: 'allocDate', title: '下拨日期', width: 110, align: 'center', sort: true},
                {field: 'voucherNo', title: '拨付文号', minWidth: 180},
                {field: 'handler', title: '经办人', width: 90},
                {field: 'status', title: '状态', width: 90, align: 'center',
                    templet: function (r) {
                        var color = r.status === '已结算' ? 'layui-bg-green'
                            : (r.status === '已下拨' ? 'layui-bg-blue'
                                : (r.status === '部分使用' ? 'layui-bg-orange' : ''));
                        return '<span class="layui-badge ' + color + '">' + (r.status || '-') + '</span>';
                    }},
                {title: '操作', width: 250, fixed: 'right', toolbar: '#allocRowBar'}
            ]]
        });

        form.on('submit(search)', function (obj) {
            table.reload('allocTable', {where: obj.field, page: {curr: 1}});
            return false;
        });

        $('#resetBtn').on('click', function () {
            setTimeout(function () {
                table.reload('allocTable', {
                    where: {year: '', month: '', deptName: '', allocType: '', status: '', keywords: ''},
                    page: {curr: 1}
                });
            }, 10);
        });

        table.on('toolbar(allocTable)', function (obj) {
            if (obj.event === 'add') {
                openForm(null);
            } else if (obj.event === 'generate') {
                genIndex = layer.open({
                    type: 1,
                    title: '按部门生成下拨单',
                    area: ['640px', '520px'],
                    content: $('#genWrap')
                });
            } else if (obj.event === 'refresh') {
                $.post('/api/salary/refresh-status', function () {
                    table.reload('allocTable');
                    layer.msg('已重算各下拨单结余');
                });
            }
        });

        $('#genCancelBtn').on('click', function () {
            layer.close(genIndex);
        });

        form.on('submit(genSubmit)', function (obj) {
            var f = obj.field;
            if (!f.approved) {
                layer.msg('请填写核定工资总额');
                return false;
            }
            $.post('/api/salary/alloc/generate-by-dept', {
                year: f.year,
                month: f.month,
                approved: f.approved,
                amount: f.amount || f.approved,
                mode: f.mode || 'quota',
                allocDate: f.allocDate || '',
                voucherNo: f.voucherNo || '',
                handler: '柳鉴益'
            }, function (res) {
                if (res.code !== 0) {
                    layer.msg(res.msg || '生成失败');
                    return;
                }
                layer.close(genIndex);
                layer.msg('已按部门生成 ' + res.data + ' 张下拨单');
                table.reload('allocTable');
            });
            return false;
        });

        table.on('tool(allocTable)', function (obj) {
            var row = obj.data;
            if (obj.event === 'edit') {
                openForm(row);
            } else if (obj.event === 'post') {
                layer.confirm('确认已收到该笔下拨资金？', function (i) {
                    layer.close(i);
                    $.post('/api/salary/alloc/post', {id: row.id}, function (res) {
                        layer.msg(res.code === 0 ? '已确认下拨' : (res.msg || '操作失败'));
                        table.reload('allocTable');
                    });
                });
            } else if (obj.event === 'reports') {
                openTab('/salary/report?allocId=' + row.id);
            } else if (obj.event === 'del') {
                layer.confirm('删除后关联的工资上报单将失去下拨来源，确认删除？', function (i) {
                    layer.close(i);
                    $.post('/api/salary/alloc/delete', {id: row.id}, function (res) {
                        layer.msg(res.code === 0 ? '已删除' : (res.msg || '删除失败'));
                        table.reload('allocTable');
                    });
                });
            }
        });

        // ---------------------------------------------------------- 表单
        function openForm(row) {
            var d = row || {};
            form.val('allocForm', {
                id: d.id || '',
                allocNo: d.allocNo || '',
                periodYear: d.periodYear || thisYear,
                periodMonth: d.periodMonth || (new Date().getMonth() + 1),
                deptName: d.deptName || '',
                allocType: d.allocType || '月度工资总额',
                sourceUnit: d.sourceUnit || '招金有色金属集团有限公司',
                targetUnit: d.targetUnit || '招远市金宝黄金矿业有限公司',
                approvedAmount: d.approvedAmount === null || d.approvedAmount === undefined ? '' : d.approvedAmount,
                allocAmount: d.allocAmount === null || d.allocAmount === undefined ? '' : d.allocAmount,
                allocDate: d.allocDate || '',
                voucherNo: d.voucherNo || '',
                handler: d.handler || '柳鉴益',
                status: d.status || '待下拨',
                remark: d.remark || ''
            });
            layerIndex = layer.open({
                type: 1,
                title: row ? '编辑下拨单' : '新增下拨单',
                area: ['900px', '600px'],
                content: $('#allocFormWrap'),
                end: function () { layerIndex = null; }
            });
        }

        $('#cancelBtn').on('click', function () {
            layer.close(layerIndex);
        });

        form.on('submit(allocSubmit)', function (obj) {
            var f = obj.field;
            var payload = {
                id: f.id ? Number(f.id) : null,
                allocNo: f.allocNo,
                periodYear: f.periodYear ? Number(f.periodYear) : null,
                periodMonth: f.periodMonth ? Number(f.periodMonth) : null,
                deptName: f.deptName,
                allocType: f.allocType,
                sourceUnit: f.sourceUnit,
                targetUnit: f.targetUnit,
                approvedAmount: f.approvedAmount === '' ? 0 : Number(f.approvedAmount),
                allocAmount: f.allocAmount === '' ? 0 : Number(f.allocAmount),
                allocDate: f.allocDate || null,
                voucherNo: f.voucherNo,
                handler: f.handler,
                status: f.status,
                remark: f.remark
            };
            $.ajax({
                url: '/api/salary/alloc/save',
                type: 'post',
                contentType: 'application/json',
                data: JSON.stringify(payload),
                success: function (res) {
                    if (res.code !== 0) {
                        layer.msg(res.msg || '保存失败');
                        return;
                    }
                    layer.close(layerIndex);
                    layer.msg('已保存');
                    table.reload('allocTable');
                }
            });
            return false;
        });

        function openTab(url) {
            if (window.parent && window.parent.layui && window.parent.layui.index) {
                window.parent.layui.index.openTabsPage(url, '');
            } else {
                window.location.href = url;
            }
        }

        function getQuery(name) {
            var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
            return m ? decodeURIComponent(m[1]) : '';
        }
    });
</script>
</body>
</html>
