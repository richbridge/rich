<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>工资明细</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/layui/css/layui.css}" rel="stylesheet">
    <link th:href="@{/admin/admin-ui/css/admin.css}" rel="stylesheet">
    <style>
        body { background: #f2f3f5; padding: 12px; }
        .search-bar { background: #fff; padding: 12px 14px 2px; border-radius: 4px; margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="layui-fluid" style="padding: 0">

    <div class="search-bar">
        <form class="layui-form" id="searchForm" lay-filter="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label" style="width:70px">所属上报单</label>
                    <div class="layui-input-inline" style="width:240px">
                        <select name="reportId" id="reportSel">
                            <option value="">全部上报单</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label" style="width:60px">年度</label>
                    <div class="layui-input-inline" style="width:100px">
                        <select name="year" id="yearSel"><option value="">全部</option></select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label" style="width:60px">月份</label>
                    <div class="layui-input-inline" style="width:90px">
                        <select name="month" id="monthSel"><option value="">全部</option></select>
                    </div>
                </div>
                <div class="layui-inline">
                    <div class="layui-input-inline" style="width:140px">
                        <select name="deptName" id="deptSel"><option value="">全部部门</option></select>
                    </div>
                </div>
                <div class="layui-inline">
                    <div class="layui-input-inline" style="width:180px">
                        <input type="text" name="keywords" placeholder="姓名 / 工号 / 岗位"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn layui-btn-sm" lay-submit lay-filter="search">查询</button>
                    <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm" id="resetBtn">重置</button>
                </div>
            </div>
        </form>
    </div>

    <div class="layui-card">
        <div class="layui-card-body">
            <table class="layui-hide" id="detailTable" lay-filter="detailTable"></table>
        </div>
    </div>

</div>

<script type="text/html" id="detailToolbar">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="add">新增明细</button>
        <button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="summary">按明细汇总上报单</button>
    </div>
</script>

<script type="text/html" id="detailRowBar">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</a>
</script>

<div id="detailFormWrap" style="display:none;padding:16px 18px 0">
    <form class="layui-form" id="detailForm" lay-filter="detailForm">
        <input type="hidden" name="id">

        <div class="layui-row layui-col-space10">
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">所属上报单</label>
                    <div class="layui-input-block">
                        <select name="reportId" id="formReportSel" lay-verify="required"></select>
                    </div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">部门</label>
                    <div class="layui-input-block">
                        <input type="text" name="deptName" id="formDept" lay-verify="required" autocomplete="off"
                               class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">用工类型</label>
                    <div class="layui-input-block">
                        <select name="empType">
                            <option value="在册">在册</option>
                            <option value="劳务派遣">劳务派遣</option>
                            <option value="外聘">外聘</option>
                            <option value="实习">实习</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-row layui-col-space10">
            <div class="layui-col-md3">
                <div class="layui-form-item">
                    <label class="layui-form-label">工号</label>
                    <div class="layui-input-block">
                        <input type="text" name="empNo" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md3">
                <div class="layui-form-item">
                    <label class="layui-form-label">姓名</label>
                    <div class="layui-input-block">
                        <input type="text" name="empName" lay-verify="required" autocomplete="off"
                               class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md3">
                <div class="layui-form-item">
                    <label class="layui-form-label">岗位</label>
                    <div class="layui-input-block">
                        <input type="text" name="post" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md3">
                <div class="layui-form-item">
                    <label class="layui-form-label">出勤天数</label>
                    <div class="layui-input-block">
                        <input type="number" name="attendance" step="0.5" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
        </div>

        <fieldset class="layui-elem-field layui-field-title" style="margin-top:6px">
            <legend style="font-size:14px">工资部分</legend>
        </fieldset>
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">岗位工资</label>
                    <div class="layui-input-block">
                        <input type="number" name="baseWage" step="0.01" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">夜班费</label>
                    <div class="layui-input-block">
                        <input type="number" name="nightFee" step="0.01" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">下井费</label>
                    <div class="layui-input-block">
                        <input type="number" name="downholeFee" step="0.01" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">补助补贴</label>
                    <div class="layui-input-block">
                        <input type="number" name="subsidy" step="0.01" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">加班工资</label>
                    <div class="layui-input-block">
                        <input type="number" name="overtimeWage" step="0.01" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
        </div>

        <fieldset class="layui-elem-field layui-field-title">
            <legend style="font-size:14px">考核与其他</legend>
        </fieldset>
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md3">
                <div class="layui-form-item">
                    <label class="layui-form-label">绩效奖金</label>
                    <div class="layui-input-block">
                        <input type="number" name="performance" step="0.01" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md3">
                <div class="layui-form-item">
                    <label class="layui-form-label">安全奖</label>
                    <div class="layui-input-block">
                        <input type="number" name="safetyBonus" step="0.01" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md3">
                <div class="layui-form-item">
                    <label class="layui-form-label">管理奖惩</label>
                    <div class="layui-input-block">
                        <input type="number" name="manageAward" step="0.01" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md3">
                <div class="layui-form-item">
                    <label class="layui-form-label">其他</label>
                    <div class="layui-input-block">
                        <input type="number" name="otherAllow" step="0.01" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
        </div>

        <fieldset class="layui-elem-field layui-field-title">
            <legend style="font-size:14px">代扣与个税</legend>
        </fieldset>
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md2">
                <div class="layui-form-item">
                    <label class="layui-form-label">养老</label>
                    <div class="layui-input-block">
                        <input type="number" name="pension" step="0.01" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md2">
                <div class="layui-form-item">
                    <label class="layui-form-label">失业</label>
                    <div class="layui-input-block">
                        <input type="number" name="unemployment" step="0.01" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md2">
                <div class="layui-form-item">
                    <label class="layui-form-label">医保</label>
                    <div class="layui-input-block">
                        <input type="number" name="medical" step="0.01" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md2">
                <div class="layui-form-item">
                    <label class="layui-form-label">公积金</label>
                    <div class="layui-input-block">
                        <input type="number" name="housingFund" step="0.01" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md2">
                <div class="layui-form-item">
                    <label class="layui-form-label">年金</label>
                    <div class="layui-input-block">
                        <input type="number" name="annuity" step="0.01" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md2">
                <div class="layui-form-item">
                    <label class="layui-form-label">个税</label>
                    <div class="layui-input-block">
                        <input type="number" name="tax" step="0.01" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <span class="layui-word-aux" style="font-size:12px">
                工资总额 = 各工资项之和；实发工资 = 工资总额 − 代扣 − 个税（保存时自动计算）
            </span>
        </div>

        <div class="layui-form-item" style="text-align:right">
            <button class="layui-btn" lay-submit lay-filter="detailSubmit">保存</button>
            <button type="button" class="layui-btn layui-btn-primary" id="cancelBtn">取消</button>
        </div>
    </form>
</div>

<script th:src="@{/layui/layui.js}"></script>
<script th:inline="none">
    layui.use(['table', 'form', 'layer', 'jquery'], function () {
        var table = layui.table;
        var form = layui.form;
        var layer = layui.layer;
        var $ = layui.jquery;

        var layerIndex = null;
        var defaultReportId = getQuery('reportId');

        var thisYear = new Date().getFullYear();
        var yearHtml = '';
        for (var y = thisYear + 1; y >= thisYear - 3; y--) {
            yearHtml += '<option value="' + y + '">' + y + '</option>';
        }
        $('#yearSel').append(yearHtml);
        var monthHtml = '';
        for (var m = 1; m <= 12; m++) {
            monthHtml += '<option value="' + m + '">' + m + ' 月</option>';
        }
        $('#monthSel').append(monthHtml);

        function money(v) {
            if (v === null || v === undefined || v === '') return '-';
            var n = Number(v);
            if (isNaN(n)) return v;
            return n.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        var reportMap = {};
        $.get('/api/salary/report/all', function (res) {
            var opts = '<option value="">请选择上报单</option>';
            if (res.code === 0) {
                (res.data || []).forEach(function (r) {
                    reportMap[r.id] = r;
                    opts += '<option value="' + r.id + '">' + r.reportNo + '（' + r.periodYear + '-'
                        + (r.periodMonth < 10 ? '0' + r.periodMonth : r.periodMonth) + ' · '
                        + r.deptName + '）</option>';
                });
            }
            $('#formReportSel').html(opts);
            $('#reportSel').append(opts.replace('<option value="">请选择上报单</option>', ''));
            if (defaultReportId) {
                $('#reportSel').val(defaultReportId);
                $('#formReportSel').val(defaultReportId);
            }
            form.render('select');
        });

        $.get('/api/salary/dept/all', function (res) {
            if (res.code === 0) {
                $('#deptSel').append((res.data || []).map(function (d) {
                    return '<option value="' + d.deptName + '">' + d.deptName + '</option>';
                }).join(''));
                form.render('select');
            }
        });
        form.render();

        // ---------------------------------------------------------- 列表
        table.render({
            elem: '#detailTable',
            url: '/api/salary/detail/list',
            method: 'get',
            toolbar: '#detailToolbar',
            defaultToolbar: ['filter', 'exports'],
            page: true,
            limit: 20,
            limits: [20, 50, 100],
            where: {reportId: defaultReportId || ''},
            cols: [[
                {field: 'empNo', title: '工号', width: 90},
                {field: 'empName', title: '姓名', width: 90},
                {field: 'deptName', title: '部门', width: 110},
                {field: 'post', title: '岗位', width: 110},
                {field: 'empType', title: '用工类型', width: 90, align: 'center'},
                {field: 'attendance', title: '出勤', width: 70, align: 'center'},
                {field: 'baseWage', title: '岗位工资', width: 100, align: 'right',
                    templet: function (r) { return money(r.baseWage); }},
                {field: 'overtimeWage', title: '加班工资', width: 100, align: 'right',
                    templet: function (r) { return money(r.overtimeWage); }},
                {field: 'performance', title: '绩效奖金', width: 100, align: 'right',
                    templet: function (r) { return money(r.performance); }},
                {field: 'safetyBonus', title: '安全奖', width: 90, align: 'right',
                    templet: function (r) { return money(r.safetyBonus); }},
                {field: 'otherAllow', title: '其他', width: 90, align: 'right',
                    templet: function (r) { return money(r.otherAllow); }},
                {field: 'grossAmount', title: '工资总额', width: 110, align: 'right', sort: true,
                    templet: function (r) {
                        return '<span style="font-weight:600">' + money(r.grossAmount) + '</span>';
                    }},
                {
                    title: '代扣合计', width: 100, align: 'right',
                    templet: function (r) {
                        var d = Number(r.pension || 0) + Number(r.unemployment || 0) + Number(r.medical || 0)
                            + Number(r.housingFund || 0) + Number(r.annuity || 0);
                        return money(d);
                    }
                },
                {field: 'tax', title: '个税', width: 90, align: 'right',
                    templet: function (r) { return money(r.tax); }},
                {field: 'netAmount', title: '实发工资', width: 110, align: 'right', sort: true,
                    templet: function (r) {
                        return '<span style="color:#2f7ef7;font-weight:600">' + money(r.netAmount) + '</span>';
                    }},
                {field: 'reportNo', title: '所属上报单', width: 130},
                {title: '操作', width: 130, fixed: 'right', toolbar: '#detailRowBar'}
            ]]
        });

        form.on('submit(search)', function (obj) {
            table.reload('detailTable', {where: obj.field, page: {curr: 1}});
            return false;
        });

        $('#resetBtn').on('click', function () {
            setTimeout(function () {
                table.reload('detailTable', {
                    where: {reportId: '', year: '', month: '', deptName: '', keywords: ''},
                    page: {curr: 1}
                });
            }, 10);
        });

        table.on('toolbar(detailTable)', function (obj) {
            if (obj.event === 'add') {
                openForm(null);
            } else if (obj.event === 'summary') {
                var rid = $('#reportSel').val();
                if (!rid) {
                    layer.msg('请先在上方选择一张上报单');
                    return;
                }
                $.post('/api/salary/report/summary', {id: rid}, function (res) {
                    if (res.code !== 0) {
                        layer.msg(res.msg || '汇总失败');
                        return;
                    }
                    layer.msg('已按明细汇总，共 ' + res.data + ' 人');
                });
            }
        });

        table.on('tool(detailTable)', function (obj) {
            var row = obj.data;
            if (obj.event === 'edit') {
                openForm(row);
            } else if (obj.event === 'del') {
                layer.confirm('确认删除该条工资明细？', function (i) {
                    layer.close(i);
                    $.post('/api/salary/detail/delete', {id: row.id}, function (res) {
                        layer.msg(res.code === 0 ? '已删除' : (res.msg || '删除失败'));
                        table.reload('detailTable');
                    });
                });
            }
        });

        // ---------------------------------------------------------- 表单
        function num(v) {
            return v === null || v === undefined || v === '' ? '' : v;
        }

        function openForm(row) {
            var d = row || {};
            var rid = d.reportId || defaultReportId || '';
            var rep = reportMap[rid];
            form.val('detailForm', {
                id: d.id || '',
                reportId: rid,
                deptName: d.deptName || (rep ? rep.deptName : ''),
                empType: d.empType || '在册',
                empNo: d.empNo || '',
                empName: d.empName || '',
                post: d.post || '',
                attendance: num(d.attendance),
                baseWage: num(d.baseWage),
                nightFee: num(d.nightFee),
                downholeFee: num(d.downholeFee),
                subsidy: num(d.subsidy),
                overtimeWage: num(d.overtimeWage),
                performance: num(d.performance),
                safetyBonus: num(d.safetyBonus),
                manageAward: num(d.manageAward),
                otherAllow: num(d.otherAllow),
                pension: num(d.pension),
                unemployment: num(d.unemployment),
                medical: num(d.medical),
                housingFund: num(d.housingFund),
                annuity: num(d.annuity),
                tax: num(d.tax)
            });
            layerIndex = layer.open({
                type: 1,
                title: row ? '编辑工资明细' : '新增工资明细',
                area: ['960px', '660px'],
                content: $('#detailFormWrap'),
                end: function () { layerIndex = null; }
            });
        }

        $('#cancelBtn').on('click', function () {
            layer.close(layerIndex);
        });

        form.on('submit(detailSubmit)', function (obj) {
            var f = obj.field;
            var payload = {
                id: f.id ? Number(f.id) : null,
                reportId: f.reportId ? Number(f.reportId) : null,
                deptName: f.deptName,
                empType: f.empType,
                empNo: f.empNo,
                empName: f.empName,
                post: f.post,
                attendance: f.attendance === '' ? 0 : Number(f.attendance),
                baseWage: f.baseWage === '' ? 0 : Number(f.baseWage),
                nightFee: f.nightFee === '' ? 0 : Number(f.nightFee),
                downholeFee: f.downholeFee === '' ? 0 : Number(f.downholeFee),
                subsidy: f.subsidy === '' ? 0 : Number(f.subsidy),
                overtimeWage: f.overtimeWage === '' ? 0 : Number(f.overtimeWage),
                performance: f.performance === '' ? 0 : Number(f.performance),
                safetyBonus: f.safetyBonus === '' ? 0 : Number(f.safetyBonus),
                manageAward: f.manageAward === '' ? 0 : Number(f.manageAward),
                otherAllow: f.otherAllow === '' ? 0 : Number(f.otherAllow),
                pension: f.pension === '' ? 0 : Number(f.pension),
                unemployment: f.unemployment === '' ? 0 : Number(f.unemployment),
                medical: f.medical === '' ? 0 : Number(f.medical),
                housingFund: f.housingFund === '' ? 0 : Number(f.housingFund),
                annuity: f.annuity === '' ? 0 : Number(f.annuity),
                tax: f.tax === '' ? 0 : Number(f.tax)
            };
            $.ajax({
                url: '/api/salary/detail/save',
                type: 'post',
                contentType: 'application/json',
                data: JSON.stringify(payload),
                success: function (res) {
                    if (res.code !== 0) {
                        layer.msg(res.msg || '保存失败');
                        return;
                    }
                    layer.close(layerIndex);
                    layer.msg('已保存');
                    table.reload('detailTable');
                }
            });
            return false;
        });

        function getQuery(name) {
            var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
            return m ? decodeURIComponent(m[1]) : '';
        }
    });
</script>
</body>
</html>
