<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>供应商管理</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/layui/css/layui.css}" rel="stylesheet">
    <link th:href="@{/admin/admin-ui/css/admin.css}" rel="stylesheet">
    <link th:href="@{/css/kdesign.css}" rel="stylesheet">
    <style>
        body { background: #F2F2F2; padding: 12px; }
        .search-bar { background: #fff; padding: 12px 14px 2px; border-radius: 4px; margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="layui-fluid" style="padding: 0">
    <div class="search-bar">
        <form class="layui-form" lay-filter="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <div class="layui-input-inline" style="width:200px">
                        <input type="text" name="keywords" placeholder="名称 / 编码 / 联系人"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <div class="layui-input-inline" style="width:150px">
                        <select name="category">
                            <option value="">全部品类</option>
                            <option value="粮油副食">粮油副食</option>
                            <option value="蔬菜水果">蔬菜水果</option>
                            <option value="肉禽水产">肉禽水产</option>
                            <option value="调料饮品">调料饮品</option>
                            <option value="燃料燃气">燃料燃气</option>
                            <option value="劳保用品">劳保用品</option>
                            <option value="设备维修">设备维修</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <div class="layui-input-inline" style="width:120px">
                        <select name="status">
                            <option value="">全部状态</option>
                            <option value="合作中">合作中</option>
                            <option value="暂停">暂停</option>
                            <option value="终止">终止</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn layui-btn-sm" lay-submit lay-filter="search">查询</button>
                    <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm" id="resetBtn">重置</button>
                </div>
            </div>
        </form>
    </div>

    <div class="layui-card">
        <div class="layui-card-body"><table class="layui-hide" id="supplierTable" lay-filter="supplierTable"></table></div>
    </div>
</div>

<script type="text/html" id="listToolbar">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="add">新增供应商</button>
    </div>
</script>
<script type="text/html" id="rowBar">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</a>
</script>

<div id="formWrap" style="display:none;padding:16px 18px 0">
    <form class="layui-form" lay-filter="editForm">
        <input type="hidden" name="id">
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">供应商编码</label>
                    <div class="layui-input-block">
                        <input type="text" name="supplierCode" lay-verify="required" placeholder="如 GYS-01"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">供应商名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="supplierName" lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">主营品类</label>
                    <div class="layui-input-block">
                        <select name="category">
                            <option value="粮油副食">粮油副食</option>
                            <option value="蔬菜水果">蔬菜水果</option>
                            <option value="肉禽水产">肉禽水产</option>
                            <option value="调料饮品">调料饮品</option>
                            <option value="燃料燃气">燃料燃气</option>
                            <option value="劳保用品">劳保用品</option>
                            <option value="设备维修">设备维修</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">结算方式</label>
                    <div class="layui-input-block">
                        <select name="settleType">
                            <option value="月结">月结</option>
                            <option value="现结">现结</option>
                            <option value="季结">季结</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">联系人</label>
                    <div class="layui-input-block">
                        <input type="text" name="contact" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">联系电话</label>
                    <div class="layui-input-block">
                        <input type="text" name="phone" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">地址</label>
            <div class="layui-input-block">
                <input type="text" name="address" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">开户行账号</label>
            <div class="layui-input-block">
                <input type="text" name="bankAccount" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">许可证号</label>
                    <div class="layui-input-block">
                        <input type="text" name="licenseNo" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-block">
                        <select name="status">
                            <option value="合作中">合作中</option>
                            <option value="暂停">暂停</option>
                            <option value="终止">终止</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">备注</label>
            <div class="layui-input-block">
                <input type="text" name="remark" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item" style="text-align:right">
            <button class="layui-btn" lay-submit lay-filter="doSubmit">保存</button>
            <button type="button" class="layui-btn layui-btn-primary" id="cancelBtn">取消</button>
        </div>
    </form>
</div>

<script th:src="@{/layui/layui.js}"></script>
<script th:inline="none">
    layui.use(['table', 'form', 'layer', 'jquery'], function () {
        var table = layui.table, form = layui.form, layer = layui.layer, $ = layui.jquery;
        var idx = null;
        var currentRow = null;
        form.render();

        function money(v) {
            if (v === null || v === undefined || v === '') return '-';
            var n = Number(v);
            return isNaN(n) ? v : n.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        table.render({
            elem: '#supplierTable', url: '/api/canteen/supplier/list', method: 'get',
            toolbar: '#listToolbar', defaultToolbar: ['filter', 'exports'],
            page: true, limit: 20, limits: [20, 50],
            cols: [[
                {field: 'supplierCode', title: '编码', width: 100, sort: true},
                {field: 'supplierName', title: '供应商名称', minWidth: 180},
                {field: 'category', title: '主营品类', width: 110, align: 'center'},
                {field: 'contact', title: '联系人', width: 90},
                {field: 'phone', title: '联系电话', width: 120},
                {field: 'settleType', title: '结算方式', width: 100, align: 'center'},
                {field: 'coopAmount', title: '累计采购(元)', width: 130, align: 'right', sort: true,
                    templet: function (r) { return money(r.coopAmount); }},
                {field: 'status', title: '状态', width: 90, align: 'center',
                    templet: function (r) {
                        return r.status === '合作中'
                                ? '<span class="layui-badge layui-bg-green">合作中</span>'
                                : '<span class="layui-badge">' + (r.status || '-') + '</span>';
                    }},
                {field: 'remark', title: '备注', minWidth: 140},
                {title: '操作', width: 130, fixed: 'right', toolbar: '#rowBar'}
            ]]
        });

        form.on('submit(search)', function (obj) {
            table.reload('supplierTable', {where: obj.field, page: {curr: 1}});
            return false;
        });
        $('#resetBtn').on('click', function () {
            setTimeout(function () {
                table.reload('supplierTable', {where: {keywords: '', category: '', status: ''}, page: {curr: 1}});
            }, 10);
        });

        table.on('toolbar(supplierTable)', function (obj) {
            if (obj.event === 'add') openForm(null);
        });
        table.on('tool(supplierTable)', function (obj) {
            if (obj.event === 'edit') openForm(obj.data);
            else if (obj.event === 'del') {
                layer.confirm('确认删除供应商「' + obj.data.supplierName + '」？', function (i) {
                    layer.close(i);
                    $.post('/api/canteen/supplier/delete', {id: obj.data.id}, function (res) {
                        layer.msg(res.code === 0 ? '已删除' : (res.msg || '删除失败'));
                        table.reload('supplierTable');
                    });
                });
            }
        });

        function openForm(row) {
            var d = row || {};
            currentRow = row || null;
            form.val('editForm', {
                id: d.id || '', supplierCode: d.supplierCode || '', supplierName: d.supplierName || '',
                category: d.category || '粮油副食', settleType: d.settleType || '月结',
                contact: d.contact || '', phone: d.phone || '', address: d.address || '',
                bankAccount: d.bankAccount || '', licenseNo: d.licenseNo || '',
                status: d.status || '合作中', remark: d.remark || ''
            });
            idx = layer.open({
                type: 1, title: row ? '编辑供应商' : '新增供应商',
                area: ['720px', '560px'], content: $('#formWrap'),
                end: function () { idx = null; }
            });
        }

        $('#cancelBtn').on('click', function () { layer.close(idx); });

        form.on('submit(doSubmit)', function (obj) {
            var f = obj.field;
            f.id = f.id ? Number(f.id) : null;
            f.coopAmount = currentRow ? (currentRow.coopAmount || 0) : 0;
            $.ajax({
                url: '/api/canteen/supplier/save', type: 'post',
                contentType: 'application/json', data: JSON.stringify(f),
                success: function (res) {
                    if (res.code !== 0) { layer.msg(res.msg || '保存失败'); return; }
                    layer.close(idx); layer.msg('已保存'); table.reload('supplierTable');
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
