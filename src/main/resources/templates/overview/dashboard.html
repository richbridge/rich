<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>综合经营数据大屏</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/layui/css/layui.css}" rel="stylesheet">
    <link th:href="@{/admin/admin-ui/css/admin.css}" rel="stylesheet">
    <style>
        body {
            background: #f2f3f5;
            padding: 12px;
        }

        .rich-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
        }

        .rich-title h2 {
            font-size: 18px;
            font-weight: 600;
            color: #2f3542;
            margin: 0;
        }

        .rich-title .rich-time {
            font-size: 13px;
            color: #99a1ae;
        }

        .rich-kpi {
            position: relative;
            overflow: hidden;
            padding: 16px 18px;
            border-radius: 4px;
            color: #fff;
        }

        .rich-kpi .rich-kpi-title {
            font-size: 13px;
            opacity: .92;
        }

        .rich-kpi .rich-kpi-value {
            margin-top: 6px;
            font-size: 24px;
            font-weight: 600;
            line-height: 1.2;
        }

        .rich-kpi .rich-kpi-unit {
            margin-left: 4px;
            font-size: 12px;
            font-weight: 400;
            opacity: .85;
        }

        .rich-kpi .rich-kpi-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 48px;
            opacity: .18;
        }

        .rich-mod {
            position: relative;
            height: 118px;
            padding: 14px 16px;
            background: #fff;
            border-radius: 4px;
            border-left: 4px solid #1E9FFF;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
            cursor: pointer;
            transition: transform .15s, box-shadow .15s;
        }

        .rich-mod:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, .1);
        }

        .rich-mod-head {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #2f3542;
        }

        .rich-mod-head i {
            font-size: 16px;
        }

        .rich-mod-metrics {
            display: flex;
            margin-top: 14px;
        }

        .rich-mod-metric {
            flex: 1;
            min-width: 0;
            padding-right: 6px;
        }

        .rich-mod-metric .v {
            font-size: 17px;
            font-weight: 600;
            color: #1f2937;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rich-mod-metric .l {
            margin-top: 2px;
            font-size: 12px;
            color: #99a1ae;
            white-space: nowrap;
        }

        .rich-mod-off {
            filter: grayscale(1);
            opacity: .6;
        }

        .rich-todo {
            padding: 10px 12px;
            margin-bottom: 8px;
            background: #fff;
            border-radius: 4px;
            border-left: 3px solid #1E9FFF;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .rich-todo:hover {
            background: #fafafa;
        }

        .rich-todo .txt {
            font-size: 13px;
            color: #4c5667;
        }

        .rich-todo .cnt {
            font-size: 16px;
            font-weight: 600;
        }

        .rich-chart {
            width: 100%;
            height: 300px;
        }

        .rich-row-gap {
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="layui-fluid" style="padding: 0">

    <!-- 标题条 -->
    <div class="rich-title">
        <h2>招金有色 · 综合经营数据大屏
            <span style="font-size:12px;color:#99a1ae;font-weight:400;margin-left:8px">
                销售 / 价格 / 盘点 / 档案 / 培训 / 工资 / 食堂 / 审计 全模块汇聚</span>
        </h2>
        <div style="display:flex;align-items:center;gap:12px">
            <span class="rich-time">数据更新：<span id="updateTime">--</span>（每 5 分钟自动刷新）</span>
            <button class="layui-btn layui-btn-sm layui-btn-normal" id="btnRefresh">
                <i class="layui-icon layui-icon-refresh"></i> 刷新
            </button>
            <button class="layui-btn layui-btn-sm layui-btn-primary" id="btnSale">
                <i class="layui-icon layui-icon-chart-screen"></i> 销售大屏
            </button>
        </div>
    </div>

    <!-- 顶层 KPI -->
    <div class="layui-row layui-col-space15 rich-row-gap" id="kpiRow">
        <div class="layui-col-md2">
            <div class="rich-kpi" style="background: linear-gradient(135deg,#16baaa,#0f9c8e);">
                <i class="layui-icon layui-icon-diamond rich-kpi-icon"></i>
                <div class="rich-kpi-title">金含量总计</div>
                <div class="rich-kpi-value"><span id="kpiTotalGold">0</span><span class="rich-kpi-unit">g</span></div>
            </div>
        </div>
        <div class="layui-col-md2">
            <div class="rich-kpi" style="background: linear-gradient(135deg,#1E9FFF,#0f7fd6);">
                <i class="layui-icon layui-icon-form rich-kpi-icon"></i>
                <div class="rich-kpi-title">精矿干重</div>
                <div class="rich-kpi-value"><span id="kpiDryWeight">0</span><span class="rich-kpi-unit">t</span></div>
            </div>
        </div>
        <div class="layui-col-md2">
            <div class="rich-kpi" style="background: linear-gradient(135deg,#F78400,#d97100);">
                <i class="layui-icon layui-icon-rmb rich-kpi-icon"></i>
                <div class="rich-kpi-title">提金结算金额</div>
                <div class="rich-kpi-value"><span id="kpiSettleAmount">0</span><span class="rich-kpi-unit">万元</span></div>
            </div>
        </div>
        <div class="layui-col-md2">
            <div class="rich-kpi" style="background: linear-gradient(135deg,#AA3130,#8a2726);">
                <i class="layui-icon layui-icon-notice rich-kpi-icon"></i>
                <div class="rich-kpi-title">欠金量</div>
                <div class="rich-kpi-value"><span id="kpiOweGold">0</span><span class="rich-kpi-unit">g</span></div>
            </div>
        </div>
        <div class="layui-col-md2">
            <div class="rich-kpi" style="background: linear-gradient(135deg,#5FB878,#479a60);">
                <i class="layui-icon layui-icon-component rich-kpi-icon"></i>
                <div class="rich-kpi-title">资产原值</div>
                <div class="rich-kpi-value"><span id="kpiAsset">0</span><span class="rich-kpi-unit">万元</span></div>
            </div>
        </div>
        <div class="layui-col-md2">
            <div class="rich-kpi" style="background: linear-gradient(135deg,#2D8CF0,#1a6fc4);">
                <i class="layui-icon layui-icon-user rich-kpi-icon"></i>
                <div class="rich-kpi-title">累计就餐</div>
                <div class="rich-kpi-value"><span id="kpiPeople">0</span><span class="rich-kpi-unit">人次</span></div>
            </div>
        </div>
    </div>

    <!-- 模块卡片 -->
    <div class="layui-row layui-col-space15 rich-row-gap" id="moduleRow"></div>

    <!-- 销售趋势 + 食堂收支 -->
    <div class="layui-row layui-col-space15 rich-row-gap">
        <div class="layui-col-md8">
            <div class="layui-card">
                <div class="layui-card-header">金属主力合约收盘价走势（SHFE，元）</div>
                <div class="layui-card-body">
                    <div id="chartMetal" class="rich-chart"></div>
                </div>
            </div>
        </div>
        <div class="layui-col-md4">
            <div class="layui-card">
                <div class="layui-card-header">跨模块待办提醒</div>
                <div class="layui-card-body" style="max-height:300px;overflow-y:auto">
                    <div id="todoList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 销售月度趋势 + 食堂月度收支 -->
    <div class="layui-row layui-col-space15 rich-row-gap">
        <div class="layui-col-md6">
            <div class="layui-card">
                <div class="layui-card-header">销售月度发货趋势（金含量 / 批次）</div>
                <div class="layui-card-body">
                    <div id="chartSaleTrend" class="rich-chart"></div>
                </div>
            </div>
        </div>
        <div class="layui-col-md6">
            <div class="layui-card">
                <div class="layui-card-header">食堂月度收支趋势（收入 / 成本 / 结余）</div>
                <div class="layui-card-body">
                    <div id="chartCanteen" class="rich-chart"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 工资 / 档案 / 盘点 -->
    <div class="layui-row layui-col-space15 rich-row-gap">
        <div class="layui-col-md4">
            <div class="layui-card">
                <div class="layui-card-header">工资核定与发放趋势（万元）</div>
                <div class="layui-card-body">
                    <div id="chartSalary" class="rich-chart"></div>
                </div>
            </div>
        </div>
        <div class="layui-col-md4">
            <div class="layui-card">
                <div class="layui-card-header">档案门类分布（案卷数）</div>
                <div class="layui-card-body">
                    <div id="chartArchive" class="rich-chart"></div>
                </div>
            </div>
        </div>
        <div class="layui-col-md4">
            <div class="layui-card">
                <div class="layui-card-header">盘点差异分布（金额 元）</div>
                <div class="layui-card-body">
                    <div id="chartInventory" class="rich-chart"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 销售结构 + 采集状态 -->
    <div class="layui-row layui-col-space15 rich-row-gap">
        <div class="layui-col-md4">
            <div class="layui-card">
                <div class="layui-card-header">发货品种金含量占比（g）</div>
                <div class="layui-card-body">
                    <div id="chartCategory" class="rich-chart"></div>
                </div>
            </div>
        </div>
        <div class="layui-col-md4">
            <div class="layui-card">
                <div class="layui-card-header">客户金含量分布（g）</div>
                <div class="layui-card-body">
                    <div id="chartBuyer" class="rich-chart"></div>
                </div>
            </div>
        </div>
        <div class="layui-col-md4">
            <div class="layui-card">
                <div class="layui-card-header">价格采集健康度</div>
                <div class="layui-card-body">
                    <table class="layui-table layui-table-sm" lay-size="sm" style="margin:0">
                        <thead>
                        <tr>
                            <th>数据源</th>
                            <th>最近任务</th>
                            <th>时间</th>
                            <th>结果</th>
                            <th>条数</th>
                        </tr>
                        </thead>
                        <tbody id="crawlBody">
                        <tr>
                            <td colspan="5" style="text-align:center;color:#99a1ae">加载中…</td>
                        </tr>
                        </tbody>
                    </table>
                    <div id="crawlTip" style="margin-top:10px;font-size:12px;color:#99a1ae"></div>
                </div>
            </div>
        </div>
    </div>

</div>

<script th:src="@{/layui/layui.js}"></script>
<script th:src="@{/vendor/echarts/echarts.min.js}"></script>
<script th:inline="none">
    layui.use(['layer'], function () {
        var $ = layui.$;
        var layer = layui.layer;

        /** 统一取值：后端返回 {code,msg,data}。 */
        function load(url, cb, failTip) {
            $.get(url, function (res) {
                if (res && res.code === 0) {
                    cb(res.data);
                } else {
                    console.warn('[大屏] ' + url + ' 返回异常', res);
                    if (failTip) {
                        layer.msg(failTip, {icon: 2});
                    }
                }
            }).fail(function (xhr) {
                console.warn('[大屏] ' + url + ' 请求失败', xhr && xhr.status);
            });
        }

        /** 数字格式化。 */
        function num(v, digits) {
            var n = Number(v || 0);
            if (isNaN(n)) {
                n = 0;
            }
            return n.toLocaleString('zh-CN', {
                minimumFractionDigits: digits === undefined ? 2 : digits,
                maximumFractionDigits: digits === undefined ? 2 : digits
            });
        }

        function setNum(id, v, digits) {
            $(id).text(num(v, digits));
        }

        /** 在框架内打开页面（不在框架内则新窗口打开）。 */
        function openPage(url, title) {
            try {
                if (parent && parent.layui && parent.layui.admin) {
                    parent.layui.admin.openTabsPage({url: url, title: title});
                    return;
                }
            } catch (e) {
                // 忽略，走兜底
            }
            window.open(url, '_blank');
        }

        // ------------------------------------------------------------ 图表容器
        var charts = {};

        function init(id) {
            var c = echarts.init(document.getElementById(id));
            charts[id] = c;
            return c;
        }

        function resizeAll() {
            for (var k in charts) {
                if (Object.prototype.hasOwnProperty.call(charts, k)) {
                    charts[k].resize();
                }
            }
        }

        window.addEventListener('resize', resizeAll);

        var EMPTY = {
            title: {
                text: '暂无数据', left: 'center', top: 'middle',
                textStyle: {color: '#c2c6ce', fontSize: 14, fontWeight: 'normal'}
            }
        };

        // ------------------------------------------------------------ 顶层 KPI
        function renderKpi(kpi) {
            setNum('#kpiTotalGold', kpi.totalGold, 2);
            setNum('#kpiDryWeight', kpi.dryWeight, 3);
            setNum('#kpiSettleAmount', Number(kpi.settlementAmount || 0) / 10000, 2);
            setNum('#kpiOweGold', kpi.oweGold, 2);
            setNum('#kpiAsset', Number(kpi.assetAmount || 0) / 10000, 2);
            setNum('#kpiPeople', kpi.canteenPeople, 0);
        }

        // ------------------------------------------------------------ 模块卡片
        function renderModules(list) {
            var html = '';
            for (var i = 0; i < (list || []).length; i++) {
                var m = list[i];
                var metrics = '';
                for (var j = 0; j < (m.metrics || []).length; j++) {
                    var it = m.metrics[j];
                    var val = (it.value === null || it.value === undefined || it.value === '')
                        ? '--' : it.value;
                    metrics += '<div class="rich-mod-metric">'
                        + '<div class="v" title="' + val + '">' + val + '</div>'
                        + '<div class="l">' + it.label
                        + (it.unit ? '（' + it.unit + '）' : '') + '</div></div>';
                }
                html += '<div class="layui-col-md3">'
                    + '<div class="rich-mod' + (m.ok ? '' : ' rich-mod-off') + '" '
                    + 'style="border-left-color:' + m.color + '" '
                    + 'data-route="' + m.route + '" data-name="' + m.name + '">'
                    + '<div class="rich-mod-head">'
                    + '<i class="layui-icon ' + m.icon + '" style="color:' + m.color + '"></i>'
                    + '<span>' + m.name + '</span>'
                    + (m.ok ? '' : '<span style="font-size:12px;color:#c2c6ce;margin-left:auto">暂不可用</span>')
                    + '</div>'
                    + '<div class="rich-mod-metrics">' + metrics + '</div>'
                    + '</div></div>';
            }
            $('#moduleRow').html(html);
            $('#moduleRow').on('click', '.rich-mod', function () {
                openPage($(this).data('route'), $(this).data('name') + '看板');
            });
        }

        // ------------------------------------------------------------ 待办提醒
        var LEVEL = {
            danger: {color: '#ff5722', badge: 'layui-bg-red', text: '紧急'},
            warn: {color: '#ffb800', badge: 'layui-bg-orange', text: '关注'},
            info: {color: '#1E9FFF', badge: 'layui-bg-blue', text: '提示'}
        };

        function renderTodos(list) {
            if (!list || !list.length) {
                $('#todoList').html('<div style="text-align:center;color:#c2c6ce;padding:40px 0;font-size:13px">'
                    + '当前没有待处理事项</div>');
                return;
            }
            var html = '';
            for (var i = 0; i < list.length; i++) {
                var t = list[i];
                var lv = LEVEL[t.level] || LEVEL.info;
                html += '<div class="rich-todo" style="border-left-color:' + lv.color + '" '
                    + 'data-route="' + t.route + '" data-name="' + t.module + '">'
                    + '<div><span class="layui-badge ' + lv.badge + '">' + lv.text + '</span> '
                    + '<span class="txt">' + t.module + '：</span></div>'
                    + '<div><span class="cnt" style="color:' + lv.color + '">' + t.count + '</span> '
                    + '<span class="txt">' + t.text + '</span></div></div>';
            }
            $('#todoList').html(html);
            $('#todoList').on('click', '.rich-todo', function () {
                openPage($(this).data('route'), $(this).data('name'));
            });
        }

        // ------------------------------------------------------------ 金属走势
        var metalChart = init('chartMetal');

        function renderMetal(d) {
            var series = d.series || [];
            if (!series.length || !d.dates.length) {
                metalChart.setOption(EMPTY, true);
                return;
            }
            var palette = ['#F78400', '#8a8f99', '#AA3130'];
            // 按计量单位拆 Y 轴：黄金元/克、白银元/千克、铜元/吨，量级差百倍，
            // 挤在一条轴上贵金属曲线会被压成直线
            var units = [];
            var yAxis = [];
            var axisIndex = {};
            for (var u = 0; u < series.length; u++) {
                var unit = series[u].unit || '';
                if (axisIndex[unit] === undefined) {
                    axisIndex[unit] = yAxis.length;
                    yAxis.push({
                        type: 'value', scale: true,
                        name: unit,
                        axisLine: {show: true}
                    });
                    units.push(unit);
                }
            }
            metalChart.setOption({
                tooltip: {trigger: 'axis'},
                legend: {data: series.map(function (s) {
                    return s.name;
                })},
                grid: {left: 70, right: yAxis.length > 1 ? 70 : 30, top: 40, bottom: 30},
                xAxis: {type: 'category', data: d.dates, boundaryGap: false},
                yAxis: yAxis,
                series: series.map(function (s, i) {
                    return {
                        name: s.name, type: 'line', data: s.data,
                        yAxisIndex: axisIndex[s.unit || ''],
                        smooth: true, connectNulls: true,
                        symbol: 'circle', symbolSize: 4,
                        lineStyle: {width: 2, color: palette[i % palette.length]},
                        itemStyle: {color: palette[i % palette.length]}
                    };
                })
            }, true);
        }

        // ------------------------------------------------------------ 销售趋势
        var saleChart = init('chartSaleTrend');

        function renderSaleTrend(list) {
            if (!list || !list.length) {
                saleChart.setOption(EMPTY, true);
                return;
            }
            var months = [], gold = [], batches = [];
            for (var i = 0; i < list.length; i++) {
                months.push(list[i].month);
                gold.push(Number(list[i].amount || 0));
                batches.push(list[i].orderCount || 0);
            }
            saleChart.setOption({
                tooltip: {trigger: 'axis'},
                legend: {data: ['金含量(g)', '批次数量']},
                grid: {left: 60, right: 50, top: 40, bottom: 30},
                xAxis: {type: 'category', data: months},
                yAxis: [
                    {type: 'value', name: 'g'},
                    {type: 'value', name: '批次'}
                ],
                series: [
                    {
                        name: '金含量(g)', type: 'bar', data: gold,
                        itemStyle: {color: '#1E9FFF'}, barMaxWidth: 28
                    },
                    {
                        name: '批次数量', type: 'line', yAxisIndex: 1, data: batches,
                        smooth: true, symbol: 'circle', symbolSize: 5,
                        lineStyle: {color: '#F78400'}, itemStyle: {color: '#F78400'}
                    }
                ]
            }, true);
        }

        // ------------------------------------------------------------ 食堂收支
        var canteenChart = init('chartCanteen');

        function renderCanteen(list) {
            if (!list || !list.length) {
                canteenChart.setOption(EMPTY, true);
                return;
            }
            var months = [], income = [], cost = [], profit = [];
            for (var i = 0; i < list.length; i++) {
                var it = list[i];
                var ic = Number(it.income || 0), cs = Number(it.cost || 0), fe = Number(it.fee || 0);
                months.push(it.ym);
                income.push(ic);
                cost.push(cs + fe);
                profit.push(ic - cs - fe);
            }
            canteenChart.setOption({
                tooltip: {trigger: 'axis'},
                legend: {data: ['收入', '成本费用', '结余']},
                grid: {left: 70, right: 20, top: 40, bottom: 30},
                xAxis: {type: 'category', data: months},
                yAxis: {type: 'value'},
                series: [
                    {
                        name: '收入', type: 'bar', data: income, barMaxWidth: 24,
                        itemStyle: {color: '#5FB878'}
                    },
                    {
                        name: '成本费用', type: 'bar', data: cost, barMaxWidth: 24,
                        itemStyle: {color: '#ffb800'}
                    },
                    {
                        name: '结余', type: 'line', data: profit, smooth: true,
                        symbol: 'circle', symbolSize: 5,
                        lineStyle: {color: '#1E9FFF'}, itemStyle: {color: '#1E9FFF'}
                    }
                ]
            }, true);
        }

        // ------------------------------------------------------------ 工资趋势
        var salaryChart = init('chartSalary');

        function renderSalary(list) {
            if (!list || !list.length) {
                salaryChart.setOption(EMPTY, true);
                return;
            }
            var labels = [], approved = [], used = [];
            for (var i = 0; i < list.length; i++) {
                labels.push(list[i].label);
                approved.push(Number(list[i].approved || 0) / 10000);
                used.push(Number(list[i].used || 0) / 10000);
            }
            salaryChart.setOption({
                tooltip: {trigger: 'axis', valueFormatter: function (v) {
                    return Number(v).toFixed(2) + ' 万元';
                }},
                legend: {data: ['核定总额', '已发放']},
                grid: {left: 60, right: 20, top: 40, bottom: 30},
                xAxis: {type: 'category', data: labels},
                yAxis: {type: 'value', name: '万元'},
                series: [
                    {
                        name: '核定总额', type: 'bar', data: approved, barMaxWidth: 22,
                        itemStyle: {color: '#AA3130'}
                    },
                    {
                        name: '已发放', type: 'bar', data: used, barMaxWidth: 22,
                        itemStyle: {color: '#16baaa'}
                    }
                ]
            }, true);
        }

        // ------------------------------------------------------------ 档案门类
        var archiveChart = init('chartArchive');

        function renderArchive(list) {
            if (!list || !list.length) {
                archiveChart.setOption(EMPTY, true);
                return;
            }
            archiveChart.setOption({
                tooltip: {trigger: 'item', formatter: '{b}: {c} 卷 ({d}%)'},
                legend: {type: 'scroll', bottom: 0},
                series: [{
                    type: 'pie', radius: ['38%', '62%'], center: ['50%', '42%'],
                    label: {formatter: '{b}\n{c} 卷'},
                    data: list.map(function (r) {
                        return {name: r.name, value: Number(r.volumeCount || 0)};
                    })
                }]
            }, true);
        }

        // ------------------------------------------------------------ 盘点差异
        var inventoryChart = init('chartInventory');

        function renderInventory(list) {
            if (!list || !list.length) {
                inventoryChart.setOption(EMPTY, true);
                return;
            }
            var names = [], profit = [], loss = [];
            for (var i = 0; i < list.length; i++) {
                names.push(list[i].label || list[i].name || '未分类');
                profit.push(Number(list[i].profit_amt || 0));
                loss.push(Number(list[i].loss_amt || 0));
            }
            inventoryChart.setOption({
                tooltip: {trigger: 'axis'},
                legend: {data: ['盘盈', '盘亏']},
                grid: {left: 70, right: 20, top: 40, bottom: 30},
                xAxis: {type: 'category', data: names},
                yAxis: {type: 'value', name: '元'},
                series: [
                    {name: '盘盈', type: 'bar', data: profit, barMaxWidth: 22, itemStyle: {color: '#F78400'}},
                    {name: '盘亏', type: 'bar', data: loss, barMaxWidth: 22, itemStyle: {color: '#AA3130'}}
                ]
            }, true);
        }

        // ------------------------------------------------------------ 销售结构
        var categoryChart = init('chartCategory');
        load('/api/dashboard/category', function (list) {
            if (!list || !list.length) {
                categoryChart.setOption(EMPTY, true);
                return;
            }
            categoryChart.setOption({
                tooltip: {trigger: 'item', formatter: '{b}: {c} g ({d}%)'},
                legend: {bottom: 0},
                series: [{
                    type: 'pie', radius: ['42%', '68%'], center: ['50%', '44%'],
                    label: {formatter: '{b}\n{c} g'},
                    data: list.map(function (r) {
                        return {name: r.name, value: Number(r.value || 0)};
                    })
                }]
            }, true);
        });

        var buyerChart = init('chartBuyer');
        load('/api/dashboard/buyer', function (list) {
            if (!list || !list.length) {
                buyerChart.setOption(EMPTY, true);
                return;
            }
            buyerChart.setOption({
                tooltip: {trigger: 'axis'},
                grid: {left: 90, right: 40, top: 20, bottom: 30},
                xAxis: {type: 'value', name: 'g'},
                yAxis: {
                    type: 'category',
                    data: list.map(function (r) {
                        return r.name;
                    })
                },
                series: [{
                    type: 'bar',
                    data: list.map(function (r) {
                        return Number(r.value || 0);
                    }),
                    itemStyle: {color: '#16baaa'},
                    barMaxWidth: 18,
                    label: {show: true, position: 'right'}
                }]
            }, true);
        });

        // ------------------------------------------------------------ 采集健康度
        var TASK = {DISCOVER: '品种发现', QUOTE: '行情采集', INTRADAY: '日间轮询', SETTLE: '夜间补采'};

        function renderCrawl(crawl) {
            var rows = crawl.latest || [];
            if (!rows.length) {
                $('#crawlBody').html('<tr><td colspan="5" style="text-align:center;color:#c2c6ce">'
                    + '尚无采集记录</td></tr>');
                return;
            }
            var html = '';
            for (var i = 0; i < rows.length; i++) {
                var r = rows[i];
                var badge, color;
                if (Number(r.status) === 1) {
                    badge = '<span class="layui-badge layui-bg-green">成功</span>';
                } else if (Number(r.status) === -2) {
                    badge = '<span class="layui-badge layui-bg-gray">跳过</span>';
                } else {
                    badge = '<span class="layui-badge layui-bg-red">失败</span>';
                }
                color = Number(r.status) === 1 ? '' : 'color:#ff5722';
                html += '<tr><td>' + r.source + '</td>'
                    + '<td>' + (TASK[r.taskType] || r.taskType || '-') + '</td>'
                    + '<td>' + (r.endTime || '-') + '</td>'
                    + '<td>' + badge + '</td>'
                    + '<td style="' + color + '">' + (r.records || 0) + '</td></tr>';
            }
            $('#crawlBody').html(html);
            $('#crawlTip').text(Number(crawl.failToday) > 0
                ? '今日有 ' + crawl.failToday + ' 次采集失败，建议到「品种字典与任务」页手动补采。'
                : '今日全部数据源采集正常。');
        }

        // ------------------------------------------------------------ 加载入口
        function reload() {
            load('/api/dashboard/overview', function (d) {
                $('#updateTime').text(d.updateTime || new Date().toLocaleString('zh-CN'));
                renderKpi(d.kpi || {});
                renderModules(d.modules);
                renderTodos(d.reminders);
                renderCrawl(d.crawl || {});
                renderCanteen((d.charts || {}).canteenTrend);
                renderSalary((d.charts || {}).salaryTrend);
                renderArchive((d.charts || {}).archiveCategory);
                renderInventory((d.charts || {}).inventoryType);
            }, '综合大屏数据加载失败，请刷新重试');
            load('/api/dashboard/trend', renderSaleTrend);
            load('/api/dashboard/price-trend?limit=24', renderMetal);
            resizeAll();
        }

        $('#btnRefresh').on('click', reload);
        $('#btnSale').on('click', function () {
            openPage('/sale/dashboard', '销售大屏');
        });

        reload();
        setInterval(reload, 5 * 60 * 1000);
    });
</script>
</body>
</html>
