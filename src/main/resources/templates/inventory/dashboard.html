<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>盘点总览</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/layui/css/layui.css}" rel="stylesheet">
    <link th:href="@{/admin/admin-ui/css/admin.css}" rel="stylesheet">
    <style>
        body { background: #f2f3f5; padding: 12px; }
        .kpi-card { background: #fff; border-radius: 4px; padding: 14px 16px; margin-bottom: 12px; }
        .kpi-title { color: #9aa1ab; font-size: 12px; }
        .kpi-value { font-size: 24px; font-weight: 700; margin-top: 6px; line-height: 28px; }
        .kpi-sub { color: #9aa1ab; font-size: 12px; margin-top: 4px; }
        .v-red { color: #e13c3c; }
        .v-green { color: #18a058; }
        .v-blue { color: #2f7ef7; }
        .chart-box { background: #fff; border-radius: 4px; padding: 12px; }
        .progress-wrap { position: relative; height: 14px; line-height: 14px; background: #eee; border-radius: 7px; }
        .progress-bar { height: 14px; border-radius: 7px; background: #2f7ef7; }
        .progress-text { position: absolute; top: 0; left: 0; width: 100%; text-align: center; font-size: 11px; }
    </style>
</head>
<body>

<div class="layui-fluid" style="padding: 0">
    <div class="layui-row layui-col-space10">
        <div class="layui-col-md2"><div class="kpi-card">
            <div class="kpi-title">盘点任务</div>
            <div class="kpi-value v-blue" id="kTask">0</div>
            <div class="kpi-sub">进行中 <span id="kRunning">0</span> · 已完成 <span id="kDone">0</span></div>
        </div></div>
        <div class="layui-col-md2"><div class="kpi-card">
            <div class="kpi-title">应盘 / 已盘</div>
            <div class="kpi-value"><span id="kChecked">0</span><span style="font-size:15px;color:#9aa1ab"> / <span id="kSubject">0</span></span></div>
            <div class="kpi-sub">盘点率 <span id="kRate">0</span>% · 未盘 <span id="kUnchecked">0</span></div>
        </div></div>
        <div class="layui-col-md2"><div class="kpi-card">
            <div class="kpi-title">盘盈</div>
            <div class="kpi-value v-red" id="kProfitCnt">0</div>
            <div class="kpi-sub">金额 <span id="kProfitAmt">0.00</span> 元</div>
        </div></div>
        <div class="layui-col-md2"><div class="kpi-card">
            <div class="kpi-title">盘亏</div>
            <div class="kpi-value v-green" id="kLossCnt">0</div>
            <div class="kpi-sub">金额 <span id="kLossAmt">0.00</span> 元</div>
        </div></div>
        <div class="layui-col-md2"><div class="kpi-card">
            <div class="kpi-title">待处理差异</div>
            <div class="kpi-value" id="kPending" style="color:#ff9f43">0</div>
            <div class="kpi-sub">需人工确认处理结论</div>
        </div></div>
        <div class="layui-col-md2"><div class="kpi-card">
            <div class="kpi-title">可盘标的规模</div>
            <div class="kpi-value" id="kScale">0</div>
            <div class="kpi-sub">资产 <span id="kAsset">0</span> · 物资 <span id="kGoods">0</span> · 食堂 <span id="kCanteen">0</span></div>
        </div></div>
    </div>

    <div class="layui-row layui-col-space10">
        <div class="layui-col-md8">
            <div class="chart-box"><div id="trendChart" style="height:280px"></div></div>
        </div>
        <div class="layui-col-md4">
            <div class="chart-box"><div id="typeChart" style="height:280px"></div></div>
        </div>
    </div>

    <div class="layui-row layui-col-space10" style="margin-top:10px">
        <div class="layui-col-md7">
            <div class="chart-box">
                <div style="font-weight:600;padding:2px 0 8px">任务进度</div>
                <table class="layui-hide" id="taskTable" lay-filter="taskTable"></table>
            </div>
        </div>
        <div class="layui-col-md5">
            <div class="chart-box">
                <div style="font-weight:600;padding:2px 0 8px">账外标的（账面为 0 却盘到实物）</div>
                <table class="layui-hide" id="extraTable" lay-filter="extraTable"></table>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/layui/layui.js}"></script>
<script th:src="@{/vendor/echarts/echarts.min.js}"></script>
<script th:inline="none">
    layui.use(['table', 'layer', 'jquery'], function () {
        var table = layui.table, layer = layui.layer, $ = layui.jquery;

        function money(v) {
            if (v === null || v === undefined || v === '') return '0.00';
            var n = Number(v);
            return isNaN(n) ? v : n.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        var trendChart = echarts.init(document.getElementById('trendChart'));
        var typeChart = echarts.init(document.getElementById('typeChart'));
        window.addEventListener('resize', function () {
            trendChart.resize();
            typeChart.resize();
        });

        $.get('/api/inventory/overview', function (res) {
            if (res.code !== 0) { layer.msg(res.msg || '加载失败'); return; }
            var d = res.data;
            $('#kTask').text(d.taskCount || 0);
            $('#kRunning').text(d.runningCount || 0);
            $('#kDone').text(d.doneCount || 0);
            $('#kSubject').text(d.subjectCount || 0);
            $('#kChecked').text(d.checkedCount || 0);
            $('#kUnchecked').text(d.uncheckedCount || 0);
            $('#kRate').text(d.checkedRate || 0);
            $('#kProfitCnt').text(d.profitCount || 0);
            $('#kProfitAmt').text(money(d.profitAmount));
            $('#kLossCnt').text(d.lossCount || 0);
            $('#kLossAmt').text(money(d.lossAmount));
            $('#kPending').text(d.pendingCount || 0);
            $('#kAsset').text(d.assetCount || 0);
            $('#kGoods').text(d.goodsCount || 0);
            $('#kCanteen').text(d.canteenCount || 0);
            $('#kScale').text((d.assetCount || 0) + (d.goodsCount || 0) + (d.canteenCount || 0));
        });

        $.get('/api/inventory/monthly-trend', function (res) {
            if (res.code !== 0) return;
            var rows = (res.data || []).slice().reverse();
            trendChart.setOption({
                title: {text: '月度盘点趋势', textStyle: {fontSize: 14}},
                tooltip: {trigger: 'axis'},
                legend: {data: ['任务数', '已盘条数', '盘盈金额', '盘亏金额'], top: 0, right: 0},
                grid: {left: 55, right: 55, top: 40, bottom: 30},
                xAxis: {type: 'category', data: rows.map(function (r) { return r.ym; })},
                yAxis: [
                    {type: 'value', name: '条数'},
                    {type: 'value', name: '元'}
                ],
                series: [
                    {name: '任务数', type: 'bar', data: rows.map(function (r) { return r.task_cnt || 0; }),
                        itemStyle: {color: '#2f7ef7'}},
                    {name: '已盘条数', type: 'bar', data: rows.map(function (r) { return r.checked_cnt || 0; }),
                        itemStyle: {color: '#5ad8a6'}},
                    {name: '盘盈金额', type: 'line', yAxisIndex: 1, smooth: true,
                        data: rows.map(function (r) { return r.profit_amt || 0; }), itemStyle: {color: '#e13c3c'}},
                    {name: '盘亏金额', type: 'line', yAxisIndex: 1, smooth: true,
                        data: rows.map(function (r) { return r.loss_amt || 0; }), itemStyle: {color: '#18a058'}}
                ]
            });
        });

        $.get('/api/inventory/type-stats', function (res) {
            if (res.code !== 0) return;
            var rows = res.data || [];
            typeChart.setOption({
                title: {text: '各类标的盘盈盘亏', textStyle: {fontSize: 14}},
                tooltip: {trigger: 'axis'},
                legend: {data: ['盘盈金额', '盘亏金额'], top: 0, right: 0},
                grid: {left: 60, right: 20, top: 40, bottom: 30},
                xAxis: {type: 'category', data: rows.map(function (r) { return r.label || r.name; })},
                yAxis: {type: 'value', name: '元'},
                series: [
                    {name: '盘盈金额', type: 'bar', data: rows.map(function (r) { return r.profit_amt || 0; }),
                        itemStyle: {color: '#e13c3c'}},
                    {name: '盘亏金额', type: 'bar', data: rows.map(function (r) { return r.loss_amt || 0; }),
                        itemStyle: {color: '#18a058'}}
                ]
            });
        });

        table.render({
            elem: '#taskTable', url: '/api/inventory/task-progress', method: 'get',
            page: false, height: 300,
            cols: [[
                {field: 'task_no', title: '任务', minWidth: 190,
                    templet: function (r) { return r.task_no + ' ' + r.task_name; }},
                {field: 'owner', title: '负责人', width: 80},
                {field: 'checked_count', title: '进度', width: 150, align: 'center',
                    templet: function (r) {
                        var pct = Number(r.progress || 0);
                        return '<div class="progress-wrap"><div class="progress-bar" style="width:'
                                + pct + '%"></div><div class="progress-text">'
                                + (r.checked_count || 0) + ' / ' + (r.subject_count || 0) + '</div></div>';
                    }},
                {field: 'diff_amount', title: '差异净额', width: 110, align: 'right',
                    templet: function (r) { return money(r.diff_amount); }},
                {field: 'status', title: '状态', width: 80, align: 'center',
                    templet: function (r) {
                        var color = r.status === '进行中' ? 'layui-bg-blue'
                                : (r.status === '已完成' ? 'layui-bg-green' : '');
                        return '<span class="layui-badge ' + color + '">' + (r.status || '-') + '</span>';
                    }}
            ]]
        });

        table.render({
            elem: '#extraTable', url: '/api/inventory/extra-subjects', method: 'get',
            page: false, height: 300,
            cols: [[
                {field: 'subject_name', title: '标的', minWidth: 130},
                {field: 'qr_code', title: '码值', width: 140,
                    templet: function (r) {
                        return '<span style="font-family:Consolas,monospace;font-size:12px">'
                                + (r.qr_code || '-') + '</span>';
                    }},
                {field: 'actual_qty', title: '实盘', width: 70, align: 'right'},
                {field: 'checker', title: '盘点人', width: 80}
            ]]
        });
    });
</script>
</body>
</html>
