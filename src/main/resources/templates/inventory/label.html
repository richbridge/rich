<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>二维码标签打印</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/layui/css/layui.css}" rel="stylesheet">
    <link th:href="@{/admin/admin-ui/css/admin.css}" rel="stylesheet">
    <link th:href="@{/css/kdesign.css}" rel="stylesheet">
    <style>
        body { background: #F2F2F2; padding: 12px; }
        .toolbar { background: #fff; padding: 12px 14px; border-radius: 4px; margin-bottom: 12px; }
        .label-grid { background: #fff; padding: 16px; border-radius: 4px; }
        .label-item { float: left; width: 220px; border: 1px solid #d8dde3; border-radius: 4px;
            padding: 10px; margin: 0 10px 10px 0; text-align: center; page-break-inside: avoid; }
        .label-qr { width: 140px; height: 140px; margin: 0 auto 6px; }
        .label-qr img, .label-qr canvas { width: 100% !important; height: 100% !important; }
        .label-name { font-weight: 600; font-size: 14px; line-height: 18px;
            max-height: 36px; overflow: hidden; }
        .label-code { font-family: Consolas, monospace; font-size: 13px; color: #333; margin-top: 3px; }
        .label-meta { color: #888; font-size: 11px; margin-top: 3px; line-height: 15px; }
        .clear { clear: both; }
        @media print {
            body { background: #fff; padding: 0; }
            .toolbar { display: none; }
            .label-grid { padding: 0; }
            .label-item { border-color: #999; }
        }
    </style>
</head>
<body>

<div class="layui-fluid" style="padding: 0">
    <div class="toolbar">
        <form class="layui-form" lay-filter="labelForm">
            <div class="layui-form-item" style="margin-bottom:0">
                <div class="layui-inline">
                    <label class="layui-form-label" style="width:70px;padding-left:0">标的类型</label>
                    <div class="layui-input-inline" style="width:150px">
                        <select name="type" id="typeSel" lay-filter="typeSel">
                            <option value="ASSET">固定资产</option>
                            <option value="GOODS">库存物资</option>
                            <option value="CANTEEN">食堂物资</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label" style="width:60px;padding-left:0">分类</label>
                    <div class="layui-input-inline" style="width:150px">
                        <select name="category" id="categorySel">
                            <option value="">全部分类</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <button type="button" class="layui-btn layui-btn-sm" id="loadBtn">生成标签</button>
                    <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="printBtn">打印</button>
                    <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="genQrBtn">
                        为未赋码标的批量赋码
                    </button>
                </div>
                <div class="layui-inline" style="color:#999999;font-size:12px">
                    打印建议：A4 纸，每张可排 8~10 枚标签，裁剪后贴于资产铭牌或货架
                </div>
            </div>
        </form>
    </div>

    <div class="label-grid">
        <div id="labelBox" style="color:#999999;padding:40px 0;text-align:center">
            选择类型后点击「生成标签」
        </div>
        <div class="clear"></div>
    </div>
</div>

<script th:src="@{/layui/layui.js}"></script>
<script th:src="@{/vendor/qrcode/qrcode.min.js}"></script>
<script th:inline="none">
    layui.use(['form', 'layer', 'jquery'], function () {
        var form = layui.form, layer = layui.layer, $ = layui.jquery;

        var urlType = new URLSearchParams(location.search).get('type');
        if (urlType) $('#typeSel').val(urlType);
        form.render('select');

        var CATEGORY_URL = {
            ASSET: '/api/inventory/asset/options',
            GOODS: '/api/inventory/goods/options',
            CANTEEN: '/api/inventory/canteen/options'
        };

        function loadCategories(type) {
            $('#categorySel').html('<option value="">全部分类</option>');
            var url = CATEGORY_URL[type];
            if (!url) { form.render('select'); return; }
            $.get(url, function (res) {
                if (res.code !== 0 || !res.data) { form.render('select'); return; }
                var cats = [];
                if (type === 'ASSET') cats = res.data.categories || [];
                else if (type === 'GOODS') cats = res.data.categories || [];
                else cats = res.data.categories || [];
                cats.forEach(function (c) {
                    $('#categorySel').append('<option value="' + c + '">' + c + '</option>');
                });
                form.render('select');
            });
        }

        loadCategories($('#typeSel').val());
        form.on('select(typeSel)', function (obj) { loadCategories(obj.value); });

        $('#loadBtn').on('click', loadLabels);
        $('#printBtn').on('click', function () { window.print(); });
        $('#genQrBtn').on('click', function () {
            var type = $('#typeSel').val();
            $.post('/api/inventory/qrcode/generate', {type: type}, function (res) {
                if (res.code !== 0) { layer.msg(res.msg || '生成失败'); return; }
                layer.msg(res.data > 0 ? ('已生成 ' + res.data + ' 个码值') : '全部标的均已赋码');
                loadLabels();
            });
        });

        function loadLabels() {
            var type = $('#typeSel').val();
            var category = $('#categorySel').val();
            $.get('/api/inventory/labels', {type: type, category: category}, function (res) {
                if (res.code !== 0) { layer.msg(res.msg || '加载失败'); return; }
                var list = res.data || [];
                if (!list.length) {
                    $('#labelBox').html('<div style="color:#999999;padding:40px 0;text-align:center">'
                            + '没有符合条件的标的</div>');
                    return;
                }
                var html = '';
                var noQr = 0;
                list.forEach(function (it) {
                    if (!it.qrCode) { noQr++; return; }
                    html += '<div class="label-item">'
                            + '<div class="label-qr" data-code="' + it.qrCode + '"></div>'
                            + '<div class="label-name">' + (it.name || '') + '</div>'
                            + '<div class="label-code">' + it.qrCode + '</div>'
                            + '<div class="label-meta">' + (it.spec || '') + '<br>'
                            + (it.location || '') + '　' + (it.dept || '')
                            + (it.custodian ? '　' + it.custodian : '') + '</div>'
                            + '</div>';
                });
                html += '<div class="clear"></div>';
                $('#labelBox').html(html);
                // 逐个渲染二维码
                $('.label-qr').each(function () {
                    new QRCode(this, {
                        text: $(this).data('code'), width: 140, height: 140,
                        colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M
                    });
                });
                if (noQr > 0) {
                    layer.msg('有 ' + noQr + ' 个标的尚未赋码，已跳过；可点击「批量赋码」后再生成', {time: 3000});
                }
            });
        }

        loadLabels();
    });
</script>
</body>
</html>
