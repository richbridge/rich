<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>库存物资</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/layui/css/layui.css}" rel="stylesheet">
    <link th:href="@{/admin/admin-ui/css/admin.css}" rel="stylesheet">
    <link th:href="@{/css/kdesign.css}" rel="stylesheet">
    <style>
        body { background: #F2F2F2; padding: 12px; }
        .search-bar { background: #fff; padding: 12px 14px 2px; border-radius: 4px; margin-bottom: 12px; }
        .qr-box { width: 180px; height: 180px; margin: 0 auto 10px; padding: 6px; background: #fff; }
        .qr-box img, .qr-box canvas { width: 100% !important; height: 100% !important; }
        .qr-code-text { text-align: center; font-family: Consolas, monospace; font-size: 13px; }
        .no-qr { color: #FB2323; }
        .low-stock { color: #FB2323; font-weight: 600; }
    </style>
</head>
<body>

<div class="layui-fluid" style="padding: 0">
    <div class="search-bar">
        <form class="layui-form" lay-filter="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <div class="layui-input-inline" style="width:200px">
                        <input type="text" name="keywords" placeholder="名称 / 编码 / 规格 / 码值"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <div class="layui-input-inline" style="width:140px">
                        <select name="category" id="searchCategory">
                            <option value="">全部分类</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <div class="layui-input-inline" style="width:140px">
                        <select name="warehouse" id="searchWarehouse">
                            <option value="">全部仓库</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn layui-btn-sm" lay-submit lay-filter="search">查询</button>
                    <button type="button" class="layui-btn layui-btn-primary layui-btn-sm" id="resetBtn">重置</button>
                </div>
            </div>
        </form>
    </div>

    <div class="layui-card">
        <div class="layui-card-body"><table class="layui-hide" id="goodsTable" lay-filter="goodsTable"></table></div>
    </div>
</div>

<script type="text/html" id="listToolbar">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="add">新增物资</button>
        <button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="genQr">批量赋码</button>
        <button class="layui-btn layui-btn-sm layui-btn-primary" lay-event="labels">标签打印</button>
    </div>
</script>
<script type="text/html" id="rowBar">
    <a class="layui-btn layui-btn-xs" lay-event="qr">二维码</a>
    <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</a>
</script>

<div id="formWrap" style="display:none;padding:16px 18px 0">
    <form class="layui-form" lay-filter="editForm">
        <input type="hidden" name="id">
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">物资编码</label>
                    <div class="layui-input-block">
                        <input type="text" name="goodsCode" lay-verify="required" placeholder="如 WZ-01"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">二维码码值</label>
                    <div class="layui-input-block">
                        <input type="text" name="qrCode" placeholder="留空自动生成 GDS-编号"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">物资名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="goodsName" lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">分类</label>
                    <div class="layui-input-block">
                        <select name="category">
                            <option value="五金材料">五金材料</option>
                            <option value="劳保用品">劳保用品</option>
                            <option value="办公用品">办公用品</option>
                            <option value="备品备件">备品备件</option>
                            <option value="低值易耗">低值易耗</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">规格型号</label>
                    <div class="layui-input-block">
                        <input type="text" name="spec" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">计量单位</label>
                    <div class="layui-input-block">
                        <input type="text" name="unit" placeholder="个 / 件 / kg" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">仓库</label>
                    <div class="layui-input-block">
                        <input type="text" name="warehouse" placeholder="如 一号物资库" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-block">
                        <select name="status">
                            <option value="正常">正常</option>
                            <option value="停用">停用</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">账面库存</label>
                    <div class="layui-input-block">
                        <input type="number" name="stockQty" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">加权单价</label>
                    <div class="layui-input-block">
                        <input type="number" name="avgPrice" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-form-item">
                    <label class="layui-form-label">安全库存</label>
                    <div class="layui-input-block">
                        <input type="number" name="safeStock" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">备注</label>
            <div class="layui-input-block">
                <input type="text" name="remark" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item" style="text-align:right">
            <button class="layui-btn" lay-submit lay-filter="doSubmit">保存</button>
            <button type="button" class="layui-btn layui-btn-primary" id="cancelBtn">取消</button>
        </div>
    </form>
</div>

<div id="qrWrap" style="display:none;padding:20px;text-align:center">
    <div class="qr-box" id="qrBox"></div>
    <div class="qr-code-text" id="qrText"></div>
    <div style="margin-top:12px;color:#888;font-size:13px" id="qrName"></div>
</div>

<script th:src="@{/layui/layui.js}"></script>
<script th:src="@{/vendor/qrcode/qrcode.min.js}"></script>
<script th:inline="none">
    layui.use(['table', 'form', 'layer', 'jquery'], function () {
        var table = layui.table, form = layui.form, layer = layui.layer, $ = layui.jquery;
        var idx = null;
        form.render();

        function money(v) {
            if (v === null || v === undefined || v === '') return '-';
            var n = Number(v);
            return isNaN(n) ? v : n.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        $.get('/api/inventory/goods/options', function (res) {
            if (res.code !== 0 || !res.data) return;
            (res.data.categories || []).forEach(function (c) {
                $('#searchCategory').append('<option value="' + c + '">' + c + '</option>');
            });
            (res.data.warehouses || []).forEach(function (w) {
                $('#searchWarehouse').append('<option value="' + w + '">' + w + '</option>');
            });
            form.render('select');
        });

        table.render({
            elem: '#goodsTable', url: '/api/inventory/goods/list', method: 'get',
            toolbar: '#listToolbar', defaultToolbar: ['filter', 'exports'],
            page: true, limit: 20, limits: [20, 50, 100],
            cols: [[
                {field: 'goodsCode', title: '物资编码', width: 110, sort: true},
                {field: 'goodsName', title: '物资名称', minWidth: 150},
                {field: 'category', title: '分类', width: 110, align: 'center'},
                {field: 'spec', title: '规格', minWidth: 130},
                {field: 'warehouse', title: '仓库', width: 120},
                {field: 'stockQty', title: '账面库存', width: 110, align: 'right', sort: true,
                    templet: function (r) {
                        var low = r.safeStock !== null && r.safeStock !== undefined
                                && Number(r.stockQty) < Number(r.safeStock);
                        return low ? '<span class="low-stock">' + r.stockQty + '</span>' : (r.stockQty || 0);
                    }},
                {field: 'safeStock', title: '安全库存', width: 100, align: 'right'},
                {field: 'avgPrice', title: '单价(元)', width: 100, align: 'right',
                    templet: function (r) { return money(r.avgPrice); }},
                {field: 'totalAmount', title: '库存金额(元)', width: 130, align: 'right',
                    templet: function (r) { return money(r.totalAmount); }},
                {field: 'qrCode', title: '二维码码值', width: 160,
                    templet: function (r) {
                        return r.qrCode
                                ? '<span style="font-family:Consolas,monospace">' + r.qrCode + '</span>'
                                : '<span class="no-qr">未赋码</span>';
                    }},
                {field: 'status', title: '状态', width: 90, align: 'center',
                    templet: function (r) {
                        return '<span class="layui-badge ' + (r.status === '正常' ? 'layui-bg-green' : '')
                                + '">' + (r.status || '-') + '</span>';
                    }},
                {title: '操作', width: 200, fixed: 'right', toolbar: '#rowBar'}
            ]]
        });

        form.on('submit(search)', function (obj) {
            table.reload('goodsTable', {where: obj.field, page: {curr: 1}});
            return false;
        });
        $('#resetBtn').on('click', function () {
            $('input[name=keywords]').val('');
            $('#searchCategory,#searchWarehouse').val('');
            form.render('select');
            table.reload('goodsTable', {where: {keywords: '', category: '', warehouse: ''}, page: {curr: 1}});
        });

        table.on('toolbar(goodsTable)', function (obj) {
            if (obj.event === 'add') openForm(null);
            else if (obj.event === 'genQr') {
                $.post('/api/inventory/qrcode/generate', {type: 'GOODS'}, function (res) {
                    layer.msg(res.code === 0 ? ('已生成 ' + res.data + ' 个码值') : (res.msg || '生成失败'));
                    table.reload('goodsTable');
                });
            } else if (obj.event === 'labels') {
                location.href = '/inventory/label?type=GOODS';
            }
        });

        table.on('tool(goodsTable)', function (obj) {
            if (obj.event === 'edit') openForm(obj.data);
            else if (obj.event === 'qr') showQr(obj.data);
            else if (obj.event === 'del') {
                layer.confirm('确认删除物资「' + obj.data.goodsName + '」？', function (i) {
                    layer.close(i);
                    $.post('/api/inventory/goods/delete', {id: obj.data.id}, function (res) {
                        layer.msg(res.code === 0 ? '已删除' : (res.msg || '删除失败'));
                        table.reload('goodsTable');
                    });
                });
            }
        });

        function openForm(row) {
            var d = row || {};
            form.val('editForm', {
                id: d.id || '', goodsCode: d.goodsCode || '', qrCode: d.qrCode || '',
                goodsName: d.goodsName || '', category: d.category || '五金材料',
                spec: d.spec || '', unit: d.unit || '个', warehouse: d.warehouse || '',
                stockQty: d.stockQty === undefined ? 0 : d.stockQty,
                avgPrice: d.avgPrice === undefined ? 0 : d.avgPrice,
                safeStock: d.safeStock === undefined ? 0 : d.safeStock,
                status: d.status || '正常', remark: d.remark || ''
            });
            idx = layer.open({
                type: 1, title: row ? '编辑物资' : '新增物资',
                area: ['760px', '520px'], content: $('#formWrap'),
                end: function () { idx = null; }
            });
        }

        function showQr(row) {
            if (!row.qrCode) {
                layer.msg('该物资尚未赋码，请先批量赋码');
                return;
            }
            $('#qrBox').html('');
            $('#qrText').text(row.qrCode);
            $('#qrName').text(row.goodsName + '（' + (row.spec || '') + '）');
            idx = layer.open({
                type: 1, title: '物资二维码', area: ['280px', '360px'], content: $('#qrWrap'),
                success: function () {
                    new QRCode(document.getElementById('qrBox'), {
                        text: row.qrCode, width: 168, height: 168,
                        colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M
                    });
                },
                end: function () { idx = null; }
            });
        }

        $('#cancelBtn').on('click', function () { layer.close(idx); });

        form.on('submit(doSubmit)', function (obj) {
            var f = obj.field;
            f.id = f.id ? Number(f.id) : null;
            f.stockQty = Number(f.stockQty || 0);
            f.avgPrice = Number(f.avgPrice || 0);
            f.safeStock = Number(f.safeStock || 0);
            f.totalAmount = Number((f.stockQty * f.avgPrice).toFixed(2));
            $.ajax({
                url: '/api/inventory/goods/save', type: 'post',
                contentType: 'application/json', data: JSON.stringify(f),
                success: function (res) {
                    if (res.code !== 0) { layer.msg(res.msg || '保存失败'); return; }
                    layer.close(idx); layer.msg('已保存'); table.reload('goodsTable');
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
