<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>用户管理</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/layui/css/layui.css}" rel="stylesheet">
    <link th:href="@{/admin/admin-ui/css/admin.css}" rel="stylesheet">
    <link th:href="@{/css/kdesign.css}" rel="stylesheet">
    <style>
        body { background: #F2F2F2; padding: 12px; }

        .rich-gap { margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="layui-fluid" style="padding: 0">

    <div class="layui-card rich-gap">
        <div class="layui-card-body">
            <form class="layui-form" id="searchForm">
                <div class="layui-inline">
                    <input type="text" name="keyword" placeholder="用户名 / 昵称" autocomplete="off"
                           class="layui-input" style="width: 220px;">
                </div>
                <button class="layui-btn" lay-submit lay-filter="searchBtn">搜索</button>
                <button type="reset" class="layui-btn layui-btn-primary">重置</button>
            </form>
        </div>
    </div>

    <div class="layui-card rich-gap">
        <div class="layui-card-body">
            <table class="layui-hide" id="userTable" lay-filter="userTable"></table>
        </div>
    </div>

    <div class="layui-card">
        <div class="layui-card-header">角色一览（角色权限在「角色权限」页维护）</div>
        <div class="layui-card-body">
            <table class="layui-hide" id="roleTable" lay-filter="roleTable"></table>
        </div>
    </div>

</div>

<script type="text/html" id="userToolbar">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="add">
            <i class="layui-icon layui-icon-add-1"></i>新增用户
        </button>
    </div>
</script>

<script type="text/html" id="userRowBar">
    <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</a>
</script>

<script type="text/html" id="roleTpl">
    {{# layui.each(d.roleNames, function(i, n){ }}
    <span class="layui-badge layui-badge-gray">{{ n }}</span>
    {{# }); }}
    {{# if(d.roleNames.length === 0){ }}<span class="layui-word-aux">未分配</span>{{# } }}
</script>

<script type="text/html" id="statusTpl">
    {{# if(d.status === 1){ }}
    <span class="layui-badge layui-bg-green">正常</span>
    {{# } else { }}
    <span class="layui-badge">停用</span>
    {{# } }}
</script>

<div id="userFormWrap" style="display: none;">
    <form class="layui-form" id="userForm" lay-filter="userForm" style="padding: 16px 24px 4px 0;">
        <input type="hidden" name="id">

        <div class="layui-form-item">
            <label class="layui-form-label">用户名</label>
            <div class="layui-input-block">
                <input type="text" name="username" lay-verify="required" autocomplete="off"
                       placeholder="登录账号" class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">昵称</label>
            <div class="layui-input-block">
                <input type="text" name="nickname" autocomplete="off" class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">密码</label>
            <div class="layui-input-block">
                <input type="password" name="password" autocomplete="off"
                       placeholder="新增必填；留空表示不修改" class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-block">
                <select name="status">
                    <option value="1">正常</option>
                    <option value="0">停用</option>
                </select>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">角色</label>
            <div class="layui-input-block" id="roleCheckbox"></div>
        </div>

        <div class="layui-form-item" style="text-align: right;">
            <button class="layui-btn" lay-submit lay-filter="userSubmit">保存</button>
            <button type="button" class="layui-btn layui-btn-primary" id="userCancel">取消</button>
        </div>
    </form>
</div>

<script th:src="@{/layui/layui.js}"></script>
<script th:inline="none">
    layui.use(['table', 'form', 'layer', 'jquery'], function () {
        var table = layui.table, form = layui.form, layer = layui.layer, $ = layui.jquery;
        var index = null;

        table.render({
            elem: '#userTable',
            url: '/api/system/users',
            method: 'get',
            toolbar: '#userToolbar',
            defaultToolbar: ['filter', 'exports'],
            page: true,
            limit: 10,
            limits: [10, 20, 50],
            cols: [[
                {field: 'id', title: 'ID', width: 70, sort: true},
                {field: 'username', title: '用户名', width: 140},
                {field: 'nickname', title: '昵称', width: 140},
                {field: 'roleNames', title: '角色', minWidth: 200, templet: '#roleTpl'},
                {field: 'status', title: '状态', width: 90, templet: '#statusTpl'},
                {title: '操作', width: 130, fixed: 'right', toolbar: '#userRowBar'}
            ]]
        });

        table.render({
            elem: '#roleTable',
            url: '/api/system/roles',
            method: 'get',
            page: false,
            cols: [[
                {field: 'roleCode', title: '角色编码', width: 160},
                {field: 'roleName', title: '角色名称', width: 160},
                {field: 'remark', title: '说明', minWidth: 240},
                {field: 'status', title: '状态', width: 90, templet: '#statusTpl'}
            ]]
        });

        form.on('submit(searchBtn)', function (data) {
            table.reload('userTable', {where: data.field, page: {curr: 1}});
            return false;
        });

        function loadRoles(selected) {
            $.get('/api/system/roles', function (res) {
                if (res.code !== 0) {
                    layer.msg('角色加载失败：' + res.msg);
                    return;
                }
                var html = '';
                layui.each(res.data, function (i, r) {
                    var checked = $.inArray(r.id, selected || []) >= 0 ? 'checked' : '';
                    html += '<input type="checkbox" name="roleIds" value="' + r.id + '" title="'
                        + r.roleName + '" ' + checked + '>';
                });
                $('#roleCheckbox').html(html);
                form.render('checkbox');
            });
        }

        function openForm(data) {
            index = layer.open({
                type: 1,
                title: data ? '编辑用户' : '新增用户',
                area: ['560px', '560px'],
                content: $('#userFormWrap')
            });
            form.val('userForm', {id: '', username: '', nickname: '', password: '', status: '1'});
            loadRoles(data ? data.roleIds : []);
            if (data) {
                form.val('userForm', {
                    id: data.id, username: data.username, nickname: data.nickname,
                    password: '', status: String(data.status)
                });
            }
        }

        table.on('toolbar(userTable)', function (obj) {
            if (obj.event === 'add') {
                openForm(null);
            }
        });

        table.on('tool(userTable)', function (obj) {
            if (obj.event === 'edit') {
                openForm(obj.data);
            } else if (obj.event === 'del') {
                layer.confirm('确认删除用户「' + obj.data.username + '」？', {icon: 3, title: '提示'}, function (i) {
                    layer.close(i);
                    $.ajax({
                        url: '/api/system/user/delete?id=' + obj.data.id, type: 'DELETE',
                        success: function (res) {
                            layer.msg(res.code === 0 ? '删除成功' : ('失败：' + res.msg));
                            table.reload('userTable');
                        }
                    });
                });
            }
        });

        form.on('submit(userSubmit)', function (data) {
            var roleIds = [];
            $('input[name=roleIds]:checked').each(function () {
                roleIds.push(parseInt($(this).val(), 10));
            });
            var payload = data.field;
            payload.roleIds = roleIds;
            $.ajax({
                url: '/api/system/user/save',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(payload),
                success: function (res) {
                    if (res.code !== 0) {
                        layer.msg('保存失败：' + res.msg);
                        return;
                    }
                    layer.close(index);
                    layer.msg('保存成功');
                    table.reload('userTable');
                }
            });
            return false;
        });

        $('#userCancel').on('click', function () {
            layer.close(index);
        });
    });
</script>
</body>
</html>
