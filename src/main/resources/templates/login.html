<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>招金有色综合数智系统</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/admin/style/imgs/logo.png}"/>
    <link th:href="@{/layui/css/layui.css}" rel="stylesheet">
    <link th:href="@{/admin/admin-ui/css/admin.css}" rel="stylesheet">
    <link th:href="@{/admin/admin-ui/css/login.css}" rel="stylesheet">
</head>
<body>

<div id="LAY-user-login" class="layadmin-user-login layadmin-user-display-show">
    <div class="layadmin-user-login-main">
        <div class="layadmin-user-login-box layadmin-user-login-header">
            <h2>招金有色</h2>
            <p>综合数智系统</p>
        </div>

        <div class="layadmin-user-login-box layadmin-user-login-body layui-form">
            <!-- 用户名 -->
            <div class="layui-form-item">
                <div class="layui-input-wrap">
                    <div class="layui-input-prefix">
                        <i class="layui-icon layui-icon-username"></i>
                    </div>
                    <label for="username"></label>
                    <input type="text" id="username" name="username" value=""
                           lay-verify="required" placeholder="用户名"
                           lay-reqtext="请填写用户名" autocomplete="off"
                           class="layui-input" lay-affix="clear">
                </div>
            </div>

            <!-- 密码 -->
            <div class="layui-form-item">
                <div class="layui-input-wrap">
                    <div class="layui-input-prefix">
                        <i class="layui-icon layui-icon-password"></i>
                </div>
                <label for="password"></label>
                <input type="password" id="password" name="password" value=""
                       lay-verify="required" placeholder="密码"
                       lay-reqtext="请填写密码" autocomplete="off"
                       class="layui-input" lay-affix="eye">
                </div>
            </div>

            <!-- 记住账号 -->
            <div class="layui-form-item" style="margin-bottom: 20px;">
                <input type="checkbox" name="remember" lay-skin="primary" title="记住账号">
                <a href="javascript:;" class="layadmin-user-jump-change layadmin-link"
                   style="margin-top: 7px;">忘记密码？</a>
                </div>

            <!-- 登录按钮 -->
            <div class="layui-form-item">
                <button class="layui-btn layui-btn-fluid" lay-submit lay-filter="rich-login">登 录</button>
            </div>

            <div class="layui-trans layui-form-item" style="color:#999;font-size:13px;">
                演示账号：admin / 123456
            </div>
        </div>
    </div>

    <div class="layui-trans layadmin-user-login-footer">
        <p>© 招金有色 综合数智系统</p>
    </div>
</div>

<script th:src="@{/layui/layui.js}"></script>
<script th:inline="none">
    layui.use(['form', 'layer'], function () {
        var form = layui.form;
        var layer = layui.layer;

        // 回填上次记住的账号
        var remembered = localStorage.getItem('rememberedUsername');
        if (remembered) {
            document.getElementById('username').value = remembered;
            form.render('checkbox');
        }

        form.on('submit(rich-login)', function (data) {
            var field = data.field;
            var btn = data.elem;
            var loadIndex = layer.load(2);
            btn.disabled = true;

            fetch('/doLogin', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'username=' + encodeURIComponent(field.username)
                    + '&password=' + encodeURIComponent(field.password)
            })
                .then(function (res) {
                    return res.json();
                })
                .then(function (res) {
                    layer.close(loadIndex);
                    btn.disabled = false;

                    if (res && res.code === 0) {
                        if (field.remember) {
                            localStorage.setItem('rememberedUsername', field.username);
                        } else {
                            localStorage.removeItem('rememberedUsername');
                        }
                        layer.msg('登录成功', {icon: 1, time: 800}, function () {
                            location.href = '/';
                        });
                    } else {
                        layer.msg((res && res.msg) || '账号或密码错误', {icon: 2});
                    }
                })
                .catch(function (err) {
                    layer.close(loadIndex);
                    btn.disabled = false;
                    layer.msg('网络异常，请稍后重试', {icon: 2});
                    console.error(err);
                });

            return false;
        });
    });
</script>

</body>
</html>
