<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>招金有色综合数智系统</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/admin/style/imgs/logo.png}"/>
    <link th:href="@{/layui/css/layui.css}" rel="stylesheet">
    <link th:href="@{/admin/admin-ui/css/admin.css}" rel="stylesheet">
    <link th:href="@{/css/kdesign.css}" rel="stylesheet">
    <style>
        /* 框架层细节：品牌双行 + 工具栏分隔 + 用户信息块 */
        .layui-layout-admin .layui-logo {
            line-height: 1.2;
            align-items: center;
        }

        .frame-brand {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .frame-brand b {
            font-size: 15px;
            font-weight: 600;
            color: #212121;
            line-height: 20px;
            white-space: nowrap;
        }

        .frame-brand em {
            font-style: normal;
            font-size: 11px;
            color: #999;
            line-height: 14px;
            letter-spacing: .5px;
        }

        .frame-tools {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 52px;
        }

        .frame-tools .layui-nav-item {
            margin: 0 2px;
        }

        .frame-divider {
            width: 1px;
            height: 18px;
            background: #E5E5E5;
            margin: 0 10px;
            display: inline-block;
            vertical-align: middle;
        }

        .frame-user {
            display: flex !important;
            align-items: center;
            gap: 8px;
            padding: 0 10px !important;
            height: 34px;
            line-height: 34px !important;
            margin: 9px 0;
            border-radius: 2px;
            border: 1px solid transparent;
            transition: background-color .2s, border-color .2s;
        }

        .frame-user:hover {
            background: #F5F5F5;
            border-color: #E5E5E5;
        }

        .frame-user .layui-nav-img {
            width: 24px;
            height: 24px;
            border-radius: 2px;
            background: #F2F8FF;
        }

        .frame-user cite {
            font-style: normal;
            font-size: 13px;
            color: #212121 !important;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: inline-block;
            vertical-align: middle;
        }

        .frame-user .layui-nav-more {
            position: static !important;
            margin-top: 0;
            top: auto;
            border-top-color: #999;
        }

        .frame-user .layui-nav-child {
            top: 40px !important;
            left: auto;
            right: 0;
        }

        .frame-user .layui-nav-child dd a {
            height: 32px;
            line-height: 32px;
            text-align: left;
            padding: 0 12px;
            color: #212121;
            font-size: 13px;
        }
    </style>
</head>
<body class="layui-layout-body" id="LAY_home_iframe">
<div id="LAY_app" style="visibility: hidden">
    <div class="layui-layout layui-layout-admin">
        <!-- 头部区域 -->
        <div class="layui-header">
            <ul class="layui-nav layui-layout-left">
                <li class="layui-nav-item layadmin-flexible" lay-unselect>
                    <a href="javascript:" layadmin-event="flexible" title="侧边伸缩">
                        <i class="layui-icon layui-icon-shrink-right" id="LAY_app_flexible"></i>
                    </a>
                </li>
                <li class="layui-nav-item" lay-unselect>
                    <a href="javascript:" layadmin-event="refresh" title="刷新">
                        <i class="layui-icon layui-icon-refresh-3"></i>
                    </a>
                </li>
            </ul>
            <ul class="layui-nav layui-layout-right" lay-filter="layadmin-layout-right">
                <li class="layui-nav-item layui-hide-xs" lay-unselect>
                    <a href="javascript:" layadmin-event="theme" title="主题设置">
                        <i class="layui-icon layui-icon-theme"></i>
                    </a>
                </li>
                <li class="layui-nav-item layui-hide-xs" lay-unselect>
                    <a href="javascript:" layadmin-event="fullscreen" title="全屏">
                        <i class="layui-icon layui-icon-screen-full"></i>
                    </a>
                </li>
                <li class="layui-nav-item" lay-unselect>
                    <span class="frame-divider"></span>
                </li>
                <li class="layui-nav-item frame-user" lay-unselect>
                    <a href="javascript:" style="display:flex;align-items:center;gap:8px;height:34px;line-height:34px">
                        <img class="layui-nav-img" th:src="@{/admin/style/imgs/template/portrait.png}" alt="">
                        <cite th:text="${nickname}">管理员</cite>
                        <i class="layui-icon layui-icon-down" style="font-size:12px;color:#999"></i>
                    </a>
                    <dl class="layui-nav-child">
                        <dd layadmin-event="logout"><a>退出登录</a></dd>
                    </dl>
                </li>
                <li class="layui-nav-item layui-hide-xs" lay-unselect>
                    <a href="javascript:" layadmin-event="about" title="关于">
                        <i class="layui-icon layui-icon-more-vertical"></i>
                    </a>
                </li>
                <li class="layui-nav-item layui-show-xs-inline-block layui-hide-sm" lay-unselect>
                    <a href="javascript:" layadmin-event="more">
                        <i class="layui-icon layui-icon-more-vertical"></i>
                    </a>
                </li>
            </ul>
        </div>

        <!-- 侧边菜单 -->
        <div class="layui-side layui-side-menu">
            <div class="layui-side-scroll">
                <div class="layui-logo" lay-href="/home">
                <span class="frame-brand"><b>招金有色</b><em>综合数智系统</em></span>
                </div>
                <!-- 菜单由后端按当前用户的权限集合裁剪后下发 -->
                <ul class="layui-nav layui-nav-tree" lay-accordion id="LAY-system-side-menu"
                    lay-filter="layadmin-system-side-menu">
                    <li th:each="m, mi : ${menus}" th:attr="data-name=${m.code}"
                        class="layui-nav-item" th:classappend="${mi.first} ? 'layui-nav-itemed'">
                        <a href="javascript:" lay-direction="2" th:attr="lay-tips=${m.name}">
                            <i class="layui-icon" th:classappend="${m.icon}"></i>
                            <cite th:text="${m.name}">模块</cite>
                        </a>
                        <dl class="layui-nav-child">
                            <dd th:each="c, ci : ${m.children}" th:attr="data-name=${c.code}"
                                th:classappend="${mi.first and ci.first} ? 'layui-this'">
                                <a th:attr="lay-href=${c.path}">
                                    <i class="layui-icon" th:classappend="${c.icon}"></i>
                                    <cite th:text="${c.name}">页面</cite>
                                </a>
                            </dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item" th:if="${#lists.isEmpty(menus)}">
                        <a href="javascript:" lay-href="/403">
                            <i class="layui-icon layui-icon-close"></i><cite>暂无可用权限</cite>
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- 页面标签 -->
        <div class="layadmin-pagetabs" id="LAY_app_tabs">
            <div class="layui-icon layadmin-tabs-control layui-icon-prev" layadmin-event="leftPage"></div>
            <div class="layui-icon layadmin-tabs-control layui-icon-next" layadmin-event="rightPage"></div>
            <div class="layui-icon layadmin-tabs-control layui-icon-down">
                <ul class="layui-nav layadmin-tabs-select" lay-filter="layadmin-pagetabs-nav">
                    <li class="layui-nav-item" lay-unselect>
                        <a href="javascript:"></a>
                        <dl class="layui-nav-child layui-anim-fadein">
                            <dd layadmin-event="closeThisTabs"><a href="javascript:">关闭当前标签页</a></dd>
                            <dd layadmin-event="closeOtherTabs"><a href="javascript:">关闭其它标签页</a></dd>
                        <dd layadmin-event="closeRightTabs"><a href="javascript:">关闭右侧标签页</a></dd>
                        <dd layadmin-event="closeAllTabs"><a href="javascript:">关闭全部标签页</a></dd>
                        </dl>
                    </li>
                </ul>
            </div>
            <div class="layui-tab" lay-unauto lay-allowClose="true" lay-filter="layadmin-layout-tabs">
                <ul class="layui-tab-title" id="LAY_app_tabsheader">
                    <li th:attr="lay-id=${homePath}, lay-attr=${homePath}" class="layui-this">
                        <i class="layui-icon layui-icon-home"></i>
                    </li>
                </ul>
            </div>
        </div>

        <!-- 主体内容 -->
        <div class="layui-body" id="LAY_app_body">
            <div class="layadmin-tabsbody-item layui-show">
                <iframe th:src="${homePath}" src="/home" class="layadmin-iframe" style="border-style: none;"></iframe>
            </div>
        </div>

        <!-- 辅助元素，一般用于移动设备下遮罩 -->
        <div class="layadmin-body-shade" layadmin-event="shade"></div>
    </div>
</div>

<script th:src="@{/layui/layui.js}"></script>
<script th:inline="none">
    layui.config({
        base: '/admin/', version: true
    }).use(['index'], function () {
        var layer = layui.layer;

        // 覆盖主题默认的"退出"行为：跳转后端 /logout，由 Sa-Token 清理会话
        layui.admin.events.logout = function () {
            layer.confirm('确定要退出登录吗？', {icon: 3, title: '提示'}, function (index) {
                layer.close(index);
                location.href = '/logout';
            });
        };
    });
</script>
</body>
</html>
