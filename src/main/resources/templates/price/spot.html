<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>现货行情</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/layui/css/layui.css}" rel="stylesheet">
    <link th:href="@{/admin/admin-ui/css/admin.css}" rel="stylesheet">
    <link th:href="@{/css/kdesign.css}" rel="stylesheet">
    <style>
        body { background: #F2F2F2; padding: 12px; }
        .rich-card-gap { margin-bottom: 12px; }
        .up { color: #FB2323; }
        .down { color: #1BA854; }
        .flat { color: #999999; }
    </style>
</head>
<body>

<div class="layui-fluid" style="padding: 0">

    <div class="layui-card rich-card-gap">
        <div class="layui-card-body">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item" style="display:inline-block;width:130px;margin-bottom:0">
                    <select name="source">
                        <option value="">全部数据源</option>
                        <option value="SGE">上金所 SGE</option>
                        <option value="SMM">上海有色 SMM</option>
                        <option value="CJ">长江有色 CJ</option>
                    </select>
                </div>
                <div class="layui-form-item" style="display:inline-block;width:200px;margin-bottom:0">
                    <input type="text" name="keywords" placeholder="品种名称 / ID" autocomplete="off"
                           class="layui-input">
                </div>
                <div class="layui-form-item" style="display:inline-block;width:250px;margin-bottom:0">
                    <input type="text" id="dateRange" name="dateRange" placeholder="交易日区间"
                           autocomplete="off" class="layui-input">
                    <input type="hidden" name="startDate" id="startDate">
                    <input type="hidden" name="endDate" id="endDate">
                </div>
                <button class="layui-btn" lay-submit lay-filter="searchBtn">搜索</button>
                <button type="reset" class="layui-btn layui-btn-primary" id="resetBtn">重置</button>
            </form>
        </div>
    </div>

    <div class="layui-card">
        <div class="layui-card-body">
            <table class="layui-hide" id="spotTable" lay-filter="spotTable"></table>
        </div>
    </div>

</div>

<script th:src="@{/layui/layui.js}"></script>
<script th:inline="none">
    layui.use(['table', 'form', 'laydate', 'jquery'], function () {
        var table = layui.table;
        var form = layui.form;
        var laydate = layui.laydate;
        var $ = layui.jquery;

        laydate.render({
            elem: '#dateRange',
            type: 'date',
            range: true,
            max: 0,
            done: function (value, start, end) {
                $('#startDate').val(start ? start.year + '-' + pad(start.month) + '-' + pad(start.date) : '');
                $('#endDate').val(end ? end.year + '-' + pad(end.month) + '-' + pad(end.date) : '');
            }
        });

        function pad(n) { return n < 10 ? '0' + n : '' + n; }

        function rate(rate) {
            if (rate === null || rate === undefined || rate === '') return '<span class="flat">-</span>';
            var n = Number(rate);
            if (isNaN(n) || n === 0) return '<span class="flat">0.00%</span>';
            return '<span class="' + (n > 0 ? 'up' : 'down') + '">'
                + (n > 0 ? '+' : '') + n.toFixed(2) + '%</span>';
        }

        function num(v) {
            if (v === null || v === undefined || v === '') return '-';
            var n = Number(v);
            return isNaN(n) ? '-' : n.toLocaleString('zh-CN', {
                minimumFractionDigits: 2, maximumFractionDigits: 2
            });
        }

        var SOURCE_NAME = {SGE: '上金所', SMM: '上海有色', CJ: '长江有色'};

        table.render({
            elem: '#spotTable',
            url: '/api/price/spot/list',
            method: 'get',
            defaultToolbar: ['filter', 'exports'],
            page: true,
            limit: 20,
            limits: [20, 50, 100],
            cols: [[
                {field: 'source', title: '数据源', width: 110, templet: function (r) {
                    var name = SOURCE_NAME[r.source] || r.source;
                    var color = r.source === 'SGE' ? '#f2a33c' : (r.source === 'SMM' ? '#5b8ff9' : '#1BA854');
                    return '<span class="layui-badge" style="background:' + color + '">' + name + '</span>';
                }},
                {field: 'productName', title: '品种', minWidth: 180},
                {field: 'productId', title: '品种ID', width: 150},
                {field: 'tradeDate', title: '交易日', width: 120, sort: true},
                {field: 'unit', title: '单位', width: 90},
                {field: 'priceOpen', title: '开盘', width: 120, templet: function (r) { return num(r.priceOpen); }},
                {field: 'priceHigh', title: '最高', width: 120, templet: function (r) { return num(r.priceHigh); }},
                {field: 'priceLow', title: '最低', width: 120, templet: function (r) { return num(r.priceLow); }},
                {field: 'priceClose', title: '收盘/均价', width: 130, sort: true, templet: function (r) { return num(r.priceClose); }},
                {field: 'changeValue', title: '涨跌', width: 110, templet: function (r) { return num(r.changeValue); }},
                {field: 'changeRate', title: '涨跌幅', width: 110, templet: function (r) { return rate(r.changeRate); }},
                {field: 'volume', title: '成交量', width: 130, templet: function (r) { return num(r.volume); }}
            ]]
        });

        form.on('submit(searchBtn)', function (data) {
            table.reload('spotTable', {
                where: {
                    source: data.field.source,
                    keywords: data.field.keywords,
                    startDate: $('#startDate').val(),
                    endDate: $('#endDate').val()
                },
                page: {curr: 1}
            });
            return false;
        });

        $('#resetBtn').on('click', function () {
            $('#startDate').val('');
            $('#endDate').val('');
            setTimeout(function () {
                table.reload('spotTable', {
                    where: {source: '', keywords: '', startDate: '', endDate: ''},
                    page: {curr: 1}
                });
            }, 10);
            return false;
        });
    });
</script>
</body>
</html>
