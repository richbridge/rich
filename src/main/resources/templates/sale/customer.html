<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>客户管理</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/layui/css/layui.css}" rel="stylesheet">
    <link th:href="@{/admin/admin-ui/css/admin.css}" rel="stylesheet">
    <style>
        body {
            background: #f2f3f5;
            padding: 12px;
        }

        .rich-card-gap {
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="layui-fluid" style="padding: 0">

    <!-- 搜索区 -->
    <div class="layui-card rich-card-gap">
        <div class="layui-card-body">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item" style="display:inline-block;width:240px;margin-bottom:0">
                    <input type="text" name="keywords" placeholder="编号 / 名称 / 联系人 / 电话"
                           autocomplete="off" class="layui-input">
                </div>
                <div class="layui-form-item" style="display:inline-block;width:130px;margin-bottom:0">
                    <select name="region">
                        <option value="">全部区域</option>
                        <option value="华东">华东</option>
                        <option value="华北">华北</option>
                        <option value="华南">华南</option>
                        <option value="华中">华中</option>
                        <option value="西南">西南</option>
                        <option value="西北">西北</option>
                        <option value="东北">东北</option>
                    </select>
                </div>
                <div class="layui-form-item" style="display:inline-block;width:120px;margin-bottom:0">
                    <select name="status">
                        <option value="">全部状态</option>
                        <option value="1">正常</option>
                        <option value="0">停用</option>
                    </select>
                </div>
                <button class="layui-btn" lay-submit lay-filter="searchBtn">搜索</button>
                <button type="reset" class="layui-btn layui-btn-primary">重置</button>
            </form>
        </div>
    </div>

    <!-- 列表 -->
    <div class="layui-card">
        <div class="layui-card-body">
            <table class="layui-hide" id="customerTable" lay-filter="customerTable"></table>
        </div>
    </div>

</div>

<!-- 头部工具栏 -->
<script type="text/html" id="customerToolbar">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="add">
            <i class="layui-icon layui-icon-add-1"></i>新增客户
        </button>
    </div>
</script>

<!-- 行操作 -->
<script type="text/html" id="customerRowBar">
    <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</a>
</script>

<!-- 客户表单 -->
<div id="customerFormWrap" style="display: none;">
    <form class="layui-form" id="customerForm" lay-filter="customerForm" style="padding: 16px 24px 4px 0;">
        <input type="hidden" name="id">

        <div class="layui-form-item">
            <label class="layui-form-label">客户编号</label>
            <div class="layui-input-block">
                <input type="text" name="customerNo" lay-verify="required" placeholder="如 C001"
                       autocomplete="off" class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">客户名称</label>
            <div class="layui-input-block">
                <input type="text" name="name" lay-verify="required" autocomplete="off" class="layui-input">
            </div>
        </div>

        <div class="layui-row">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">联系人</label>
                    <div class="layui-input-block">
                        <input type="text" name="contact" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">联系电话</label>
                <div class="layui-input-block">
                        <input type="text" name="phone" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-row">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">客户等级</label>
                    <div class="layui-input-block">
                        <select name="level">
                            <option value="战略客户">战略客户</option>
                            <option value="重要客户">重要客户</option>
                            <option value="普通客户">普通客户</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">所属区域</label>
                    <div class="layui-input-block">
                    <select name="region">
                            <option value="">请选择</option>
                            <option value="华东">华东</option>
                            <option value="华北">华北</option>
                            <option value="华南">华南</option>
                            <option value="华中">华中</option>
                            <option value="西南">西南</option>
                            <option value="西北">西北</option>
                            <option value="东北">东北</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">所属行业</label>
            <div class="layui-input-block">
                <input type="text" name="industry" autocomplete="off" class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-block">
                <select name="status">
                    <option value="1">正常</option>
                    <option value="0">停用</option>
                </select>
            </div>
        </div>

        <div class="layui-form-item" style="text-align: right;">
            <button class="layui-btn" lay-submit lay-filter="customerSubmit">保存</button>
            <button type="button" class="layui-btn layui-btn-primary" id="customerCancel">取消</button>
        </div>
    </form>
</div>

<script th:src="@{/layui/layui.js}"></script>
<script th:inline="none">
    layui.use(['table', 'form', 'layer', 'jquery'], function () {
        var table = layui.table;
        var form = layui.form;
        var layer = layui.layer;
        var $ = layui.jquery;
        var layerIndex = null;

        table.render({
            elem: '#customerTable',
            url: '/api/customer/list',
            method: 'get',
            toolbar: '#customerToolbar',
            defaultToolbar: ['filter', 'exports'],
            page: true,
            limit: 10,
            limits: [10, 20, 50],
            cols: [[
                {type: 'checkbox', fixed: 'left'},
                {field: 'customerNo', title: '客户编号', width: 120, sort: true},
                {field: 'name', title: '客户名称', minWidth: 230},
                {field: 'contact', title: '联系人', width: 100},
                {field: 'phone', title: '联系电话', width: 130},
                {field: 'level', title: '客户等级', width: 110},
                {field: 'region', title: '所属区域', width: 100},
                {field: 'industry', title: '所属行业', minWidth: 140},
                {
                    field: 'status', title: '状态', width: 90,
                    templet: function (r) {
                        return r.status === 1
                            ? '<span class="layui-badge layui-bg-green">正常</span>'
                            : '<span class="layui-badge">停用</span>';
                    }
                },
                {title: '操作', width: 130, fixed: 'right', toolbar: '#customerRowBar'}
            ]]
        });

        form.on('submit(searchBtn)', function (data) {
            table.reload('customerTable', {where: data.field, page: {curr: 1}});
            return false;
        });

        table.on('toolbar(customerTable)', function (obj) {
            if (obj.event === 'add') {
                openForm(null);
            }
        });

        table.on('tool(customerTable)', function (obj) {
            var row = obj.data;
            if (obj.event === 'edit') {
                openForm(row);
            } else if (obj.event === 'del') {
                layer.confirm('确认删除客户「' + esc(row.name) + '」吗？', {icon: 3, title: '提示'}, function (i) {
                    layer.close(i);
                    $.post('/api/customer/delete', {id: row.id}, function (res) {
                        if (res.code === 0) {
                            layer.msg('删除成功', {icon: 1});
                            table.reload('customerTable');
                        } else {
                            layer.msg(res.msg || '删除失败');
                    }
                    });
                });
            }
        });

        function openForm(row) {
            var data = row || {};
            form.val('customerForm', {
                id: data.id || '',
                customerNo: data.customerNo || '',
                name: data.name || '',
                contact: data.contact || '',
                phone: data.phone || '',
                level: data.level || '普通客户',
                region: data.region || '',
                industry: data.industry || '',
                status: data.status === undefined ? 1 : data.status
            });
            layerIndex = layer.open({
                type: 1,
                title: row ? '编辑客户' : '新增客户',
                area: ['720px', '560px'],
                content: $('#customerFormWrap'),
                shadeClose: false,
                end: function () {
                    layerIndex = null;
                }
            });
        }

        form.on('submit(customerSubmit)', function (data) {
            var payload = {
                id: data.field.id ? Number(data.field.id) : null,
                customerNo: data.field.customerNo,
                name: data.field.name,
                contact: data.field.contact,
                phone: data.field.phone,
                level: data.field.level,
                region: data.field.region,
                industry: data.field.industry,
                status: Number(data.field.status)
            };
            $.ajax({
                url: '/api/customer/save',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(payload),
                success: function (res) {
                    if (res.code === 0) {
                        layer.msg('保存成功', {icon: 1});
                        layer.close(layerIndex);
                        table.reload('customerTable');
                    } else {
                        layer.msg(res.msg || '保存失败');
                    }
                },
                error: function () {
                    layer.msg('请求异常，请稍后重试');
                }
            });
            return false;
        });

        $('#customerCancel').on('click', function () {
            if (layerIndex !== null) layer.close(layerIndex);
        });

        function esc(s) {
            if (s === null || s === undefined) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    });
</script>
</body>
</html>
