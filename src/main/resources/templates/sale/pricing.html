<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>点价管理</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/layui/css/layui.css}" rel="stylesheet">
    <link th:href="@{/admin/admin-ui/css/admin.css}" rel="stylesheet">
    <link th:href="@{/css/kdesign.css}" rel="stylesheet">
    <style>
        body {
            background: #F2F2F2;
            padding: 12px;
        }

        .rich-card-gap {
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="layui-fluid" style="padding: 0">

    <!-- 点价情况台账 -->
    <div class="layui-card rich-card-gap">
        <div class="layui-card-header">点价情况表（上年余量 / 点价量 / 已发货 / 已提金 / 库存 / 欠金量）</div>
        <div class="layui-card-body">
            <table class="layui-hide" id="tableFix" lay-filter="tableFix"></table>
        </div>
    </div>

    <!-- 点价记录 -->
    <div class="layui-card">
        <div class="layui-card-header">点价记录</div>
        <div class="layui-card-body">
            <table class="layui-hide" id="tablePricing" lay-filter="tablePricing"></table>
        </div>
    </div>

</div>

<script type="text/html" id="toolbarPricing">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="add">
            <i class="layui-icon layui-icon-add-1"></i>新增点价
        </button>
    </div>
</script>

<script type="text/html" id="rowBarPricing">
    <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</a>
</script>

<!-- 点价表单 -->
<div id="pricingFormWrap" style="display: none;">
    <form class="layui-form" id="pricingForm" lay-filter="pricingForm" style="padding: 16px 24px 4px 0;">
        <input type="hidden" name="id">

        <div class="layui-row">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">点价品种</label>
                    <div class="layui-input-block">
                        <select name="variety" lay-verify="required">
                            <option value="浮选金">浮选金</option>
                            <option value="合质金">合质金</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">点价日</label>
                    <div class="layui-input-block">
                        <input type="text" name="priceDate" id="priceDate" lay-verify="required"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-row">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">点价(元/克)</label>
                    <div class="layui-input-block">
                        <input type="number" name="fixPrice" step="0.01" lay-verify="required"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">结算价(元/克)</label>
                    <div class="layui-input-block">
                        <input type="number" name="settlePrice" step="0.01" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-row">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">点价数量(g)</label>
                    <div class="layui-input-block">
                        <input type="number" name="quantity" step="0.01" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">成交额(万元)</label>
                    <div class="layui-input-block">
                        <input type="number" name="amount" step="0.01" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-row">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">分组</label>
                    <div class="layui-input-block">
                        <input type="text" name="groupTag" placeholder="如 26年点价" autocomplete="off"
                               class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-input-block">
                        <input type="text" name="remark" autocomplete="off" class="layui-input">
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-form-item" style="text-align: right;">
            <button class="layui-btn" lay-submit lay-filter="pricingSubmit">保存</button>
            <button type="button" class="layui-btn layui-btn-primary" id="pricingCancel">取消</button>
        </div>
    </form>
</div>

<script th:src="@{/layui/layui.js}"></script>
<script th:inline="none">
    layui.use(['table', 'form', 'laydate', 'layer', 'jquery'], function () {
        var table = layui.table;
        var form = layui.form;
        var laydate = layui.laydate;
        var layer = layui.layer;
        var $ = layui.jquery;

        var formIndex = null;

        function num(v, d) {
            var n = Number(v || 0);
            if (isNaN(n)) n = 0;
            return n.toLocaleString('zh-CN', {
                minimumFractionDigits: d === undefined ? 2 : d,
                maximumFractionDigits: d === undefined ? 2 : d
            });
        }

        function esc(s) {
            if (s === null || s === undefined) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ------------------------------------------------------ 点价情况
        table.render({
            elem: '#tableFix',
            url: '/api/sale/fix/list',
            method: 'get',
            page: false,
            cols: [[
                {field: 'statYear', title: '年度', width: 90},
                {field: 'variety', title: '点价种类', minWidth: 150},
                {field: 'prevBalance', title: '上年余量(g)', width: 130, templet: function (r) { return num(r.prevBalance, 2); }},
                {field: 'fixQty', title: '点价量(g)', width: 120, templet: function (r) { return num(r.fixQty, 2); }},
                {field: 'shippedQty', title: '已发货量(g)', width: 130, templet: function (r) { return num(r.shippedQty, 2); }},
                {field: 'extractedQty', title: '已提金(g)', width: 120, templet: function (r) { return num(r.extractedQty, 2); }},
                {field: 'stockQty', title: '库存(g)', width: 110, templet: function (r) { return num(r.stockQty, 2); }},
                {
                    field: 'oweQty', title: '欠金量(g)', width: 120,
                    templet: function (r) {
                        var v = Number(r.oweQty || 0);
                        var cls = v < 0 ? 'layui-badge layui-bg-green' : 'layui-badge layui-bg-red';
                        return '<span class="' + cls + '">' + num(v, 2) + '</span>';
                    }
                },
                {field: 'remark', title: '备注', minWidth: 160}
            ]]
        });

        // ------------------------------------------------------ 点价记录
        table.render({
            elem: '#tablePricing',
            url: '/api/sale/pricing/list',
            method: 'get',
            toolbar: '#toolbarPricing',
            defaultToolbar: ['filter', 'exports'],
            page: false,
            cols: [[
                {field: 'variety', title: '点价品种', width: 110},
                {field: 'priceDate', title: '点价日', width: 120},
                {field: 'fixPrice', title: '点价(元/克)', width: 130, templet: function (r) { return num(r.fixPrice, 2); }},
                {field: 'settlePrice', title: '结算价(元/克)', width: 140, templet: function (r) { return num(r.settlePrice, 2); }},
                {field: 'quantity', title: '点价数量(g)', width: 130, templet: function (r) { return num(r.quantity, 2); }},
                {field: 'avgPrice', title: '平均点价', width: 120, templet: function (r) { return num(r.avgPrice, 2); }},
                {field: 'amount', title: '成交额(万元)', width: 130, templet: function (r) { return num(r.amount, 2); }},
                {field: 'groupTag', title: '分组', width: 120},
                {field: 'remark', title: '备注', minWidth: 140},
                {title: '操作', width: 120, fixed: 'right', toolbar: '#rowBarPricing'}
            ]]
        });

        // ------------------------------------------------------ 工具栏与行工具
        table.on('toolbar(tablePricing)', function (obj) {
            if (obj.event === 'add') openForm(null);
        });

        table.on('tool(tablePricing)', function (obj) {
            var row = obj.data;
            if (obj.event === 'edit') {
                openForm(row);
            } else if (obj.event === 'del') {
                layer.confirm('确认删除该点价记录吗？', {icon: 3, title: '提示'}, function (i) {
                    layer.close(i);
                    $.post('/api/sale/pricing/delete', {id: row.id}, function (res) {
                        if (res.code === 0) {
                            layer.msg('删除成功', {icon: 1});
                            table.reload('tablePricing');
                        } else {
                            layer.msg(res.msg || '删除失败');
                        }
                    });
                });
            }
        });

        // ------------------------------------------------------ 表单
        function openForm(row) {
            var data = row || {};
            form.val('pricingForm', {
                id: data.id || '',
                variety: data.variety || '浮选金',
                priceDate: data.priceDate || '',
                fixPrice: data.fixPrice === null || data.fixPrice === undefined ? '' : data.fixPrice,
                settlePrice: data.settlePrice === null || data.settlePrice === undefined ? '' : data.settlePrice,
                quantity: data.quantity === null || data.quantity === undefined ? '' : data.quantity,
                amount: data.amount === null || data.amount === undefined ? '' : data.amount,
                groupTag: data.groupTag || '',
                remark: data.remark || ''
            });
            laydate.render({elem: '#priceDate', type: 'date'});
            formIndex = layer.open({
                type: 1,
                title: row ? '编辑点价' : '新增点价',
                area: ['820px', '480px'],
                content: $('#pricingFormWrap'),
                end: function () { formIndex = null; }
            });
        }

        form.on('submit(pricingSubmit)', function (d) {
            var f = d.field;
            function dec(v) {
                if (v === '' || v === null || v === undefined) return null;
                return Number(v);
            }
            var payload = {
                id: f.id ? Number(f.id) : null,
                variety: f.variety,
                priceDate: f.priceDate || null,
                fixPrice: dec(f.fixPrice),
                settlePrice: dec(f.settlePrice),
                quantity: dec(f.quantity),
                amount: dec(f.amount),
                groupTag: f.groupTag,
                remark: f.remark
            };
            $.ajax({
                url: '/api/sale/pricing/save',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(payload),
                success: function (res) {
                    if (res.code === 0) {
                        layer.msg('保存成功', {icon: 1});
                        layer.close(formIndex);
                        table.reload('tablePricing');
                    } else {
                        layer.msg(res.msg || '保存失败');
                    }
                },
                error: function () { layer.msg('请求异常，请稍后重试'); }
            });
            return false;
        });

        $('#pricingCancel').on('click', function () {
            if (formIndex !== null) layer.close(formIndex);
        });
    });
</script>
</body>
</html>
